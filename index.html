axe",cid:"R04.0",sistema:"Respiratório e ORL",epidemiologia:"Distribuição bimodal (crianças de 2 a 10 anos e idosos de 50 a 80 anos),ar seco/baixa umidade, trauma digital nasal, rinite alérgica, uso de sprays nasais de corticoide, hipertensão arterial, uso de anticoagulantes/antiagregantes (varfarina, DOACs, AAS), coagulopatias ou etilismo/hepatopatia.",exameFisico:"Avaliação hemodinâmica (PA, FC, perfusão periférica), rinoscopia anterior sob iluminação e aspiração de coágulos (localizar ponto sangrante na área de Little/plexo de Kiesselbach), e oroscopia (verificar escorrimento ativo pela parede posterior da faringe sugerindo epistaxe posterior da artéria esfenopalatina).",obrigatorios:{descricao:"Extravasamento ativo ou recente de sangue pela cavidade nasal (anterior ou posterior)",termos:["epistaxe","rinorragia","sangramento nasal anterior","sangramento nasal posterior","sangramento de plexo de Kiesselbach","sangue pelo nariz","nariz sangrando","hemorragia no nariz","sangue escorrendo na garganta"]},comuns:{descricao:"Sangramento unilateral, formação de coágulos nasais, gosto metálico na boca, ansiedade",termos:["coágulos intranasais","disgeusia metálica","ansiedade","sangramento unilateral","postas de sangue pelo nariz","gosto de sangue na boca","gosto de ferro na garganta","sangue saindo por uma narina"]},atipicos:{descricao:"Hematêmese ou melena (sangue deglutido), choque hipovolêmico, sangramento bilateral maciço refratário",termos:["hematêmese secundária","melena","instabilidade hemodinâmica","hipotensão","taquicardia","choque hipovolêmico","palidez","vômito com sangue escuro","fezes pretas","tontura ao levantar","desmaio","sangramento que não estanca"]}},{id:"hipertensao-arterial-crise-hipertensiva",nome:"Hipertensão arterial / Crise hipertensiva",cid:"I10",sistema:"Cardiovascular",epidemiologia:"Adultos e idosos (prevalência > 60% acima dos 60 anos),maior prevalência e gravidade na população negra/afrodescendente,história familiar positiva, obesidade, dieta hipersódica, sedentarismo, doença renal crônica, apneia obstrutiva do sono e má adesão medicamentosa.",exameFisico:"Aferição da PA nos dois membros superiores (com manguito adequado à circunferência braquial, excluir pseudocrise ou assimetria de pulso na dissecção de aorta), fundoscopia direta (pesquisar hemorragias, exsudatos e papiledema), ausculta cardíaca (B4, sopros) e pulmonar (estertores), exame neurológico sumário e palpação de pulsos periféricos.",obrigatorios:{descricao:"PA sistólica >= 140 mmHg e/ou diastólica >= 90 mmHg (Crise: >= 180/120 mmHg)",termos:["hipertensão arterial","elevação pressórica","pico hipertensivo","urgência hipertensiva","emergência hipertensiva","pseudocrise hipertensiva","pressão alta","pressão subiu","pressão nas alturas"]},comuns:{descricao:"Assintomática,nas elevações agudas: cefaleia nucal ou holocraniana, tontura, zumbido, mal-estar, ansiedade",termos:["assintomático","cefaleia occipital","cefaleia nucal","tontura","acúfenos","tinido","mal-estar","ansiedade","dor na nuca","peso na nuca","dor de cabeça","zumbido no ouvido","chiado no ouvido","vista embaralhada"]},atipicos:{descricao:"Dor torácica isquêmica, dispneia súbita com estertores (EAP), déficit focal, rebaixamento da consciência e papiledema (encefalopatia), escotomas",termos:["precordialgia","edema agudo de pulmão","dispneia","estertores pulmonares","déficit neurológico focal","encefalopatia hipertensiva","papiledema","escotomas cintilantes","dor no peito","falta de ar súbita","afogando a seco","boca torta","confusão mental","pontos brilhantes na visão"]}},{id:"insuficiencia-cardiaca-descompensada",nome:"Insuficiência cardíaca descompensada",cid:"I50.0",sistema:"Cardiovascular",epidemiologia:"Idosos (> 65 anos),antecedentes de IAM prévio/doença arterial coronariana, HAS de longa data, doença de Chagas (epidemiologia de zona endêmica/rural no Brasil), valvopatias reumáticas ou degenerativas, miocardiopatia alcoólica, transgressão hídrica/salina ou infecção precipitante.",exameFisico:"Classificação hemodinâmica de Stevenson (perfusão vs. congestão), pesquisa de turgência jugular patológica a 45° e refluxo hepatojugular, palpação do ictus cordis (desviado/difuso), ausculta cardíaca (ritmo de galope por B3, sopros de insuficiência mitral/tricúspide), ausculta pulmonar (estertores crepitantes bibasais ou difusos), palpação hepática e pesquisa de edema sacral e de MMII (sinal de Godet/cacifo).",obrigatorios:{descricao:"Evidência clínica de congestão pulmonar/sistêmica e/ou baixo débito cardíaco",termos:["congestão pulmonar","congestão sistêmica","baixo débito cardíaco","síndrome de insuficiência cardíaca","hipervolemia","coração fraco","coração grande","coração inchado","água no pulmão"]},comuns:{descricao:"Dispneia aos esforços/repouso, ortopneia, DPN, edema simétrico de MMII (cacifo +), turgência jugular, estertores bibasais, presença de B3",termos:["dispneia aos esforços","ortopneia","dispneia paroxística noturna","edema de membros inferiores","sinal de Godet positivo","cacifo positivo","turgência jugular patológica","refluxo hepatojugular","estertores crepitantes bibasais","terceira bulha","ritmo de galope","falta de ar para caminhar","cansaço fácil","não consegue dormir reto","usa vários travesseiros","acorda sufocado à noite","pernas inchadas","pés inchados","veia do pescoço inchada"]},atipicos:{descricao:"Caquexia cardíaca, dor em HCD e plenitude precoce (congestão hepática), tosse seca noturna isolada, confusão mental e extremidades frias",termos:["caquexia cardíaca","hepatomegalia congestiva","dor em hipocôndrio direito","ascite","plenitude pós-prandial","tosse noturna","hipoperfusão periférica","extremidades frias","tempo de enchimento capilar lento","delirium","emagrecimento","barriga d'água","estufamento ao comer pouco","tosse seca ao deitar","mãos e pés gelados"]}},{id:"sindrome-coronariana-aguda-angina-instavel",nome:"Síndrome Coronariana Aguda / Angina instável",cid:"I20.0",sistema:"Cardiovascular",epidemiologia:"Homens > 45 anos e mulheres > 55 anos (pós-menopausa),tabagistas, hipertensos, diabéticos, dislipidêmicos, obesos, história familiar de DAC precoce (homem < 55a, mulher < 65a), doença arterial periférica ou doença renal crônica.",exameFisico:"Sinais vitais, avaliação de perfusão, ausculta cardíaca (pesquisar surgimento de B4, B3 ou sopro novo de insuficiência mitral isquêmica), ausculta pulmonar (Classificação de Killip-Kimball), palpação da parede torácica (reprodução da dor à dígito-pressão reduz probabilidade de SCA, mas não exclui).",obrigatorios:{descricao:"Dor ou desconforto torácico isquêmico (ou equivalente anginoso) em repouso, de início recente ou em crescendo",termos:["dor torácica típica","precordialgia","dor retroesternal","angina pectoris","angina instável","angina em crescendo","dor isquêmica","dor no peito","aperto no peito","peso no peito","queimação no meio do peito"]},comuns:{descricao:"Dor retroesternal em aperto/opressão, irradiação para MSE, mandíbula, pescoço ou dorso, sudorese fria, náuseas, duração > 10-20 min",termos:["dor opressiva","sinal de Levine","irradiação para membro superior esquerdo","irradiação mandibular","irradiação cervical","irradiação dorsal","diaforese","sudorese fria","náuseas","dor correndo para o braço esquerdo","dor no queixo","dor no pescoço","suor frio","enjoo","mão fechada no peito"]},atipicos:{descricao:"Dispneia súbita inexplicada isolada, epigastralgia isolada, síncope, fadiga extrema súbita, dor apenas em punhos ou interescapular",termos:["equivalente anginoso","dispneia súbita","epigastralgia","dispepsia-símile","síncope","astenia súbita","dor interescapular","falta de ar do nada","dor na boca do estômago","azia forte","desmaio","fraqueza repentina","dor nas costas entre as pás"]}},{id:"infarto-agudo-do-miocardio-iam",nome:"Infarto Agudo do Miocárdio (IAM)",cid:"I21.9",sistema:"Cardiovascular",epidemiologia:"Adultos de meia-idade e idosos com fatores de risco cardiovasculares clássicos (HAS, DM2, tabagismo, dislipidemia),em jovens (< 40 anos), investigar uso de cocaína/crack, trombofilias ou hipercolesterolemia familiar,mulheres, idosos e diabéticos têm alta prevalência de apresentações atípicas.",exameFisico:"Monitorização multiparamétrica imediata (PA em ambos os braços, FC, SpO2), Classificação de Killip-Kimball (ausculta pulmonar para estertores e pesquisa de B3/choque cardiogênico), avaliação de turgência jugular com pulmões limpos (sugere IAM de ventrículo direito nos infartos inferiores).",obrigatorios:{descricao:"Injúria miocárdica aguda associada a sintomas isquêmicos prolongados ou equivalentes",termos:["precordialgia intensa","dor torácica opressiva prolongada","isquemia miocárdica aguda","infarto","ataque cardíaco","dor insuportável no peito","peito esmagando"]},comuns:{descricao:"Dor retroesternal intensa (> 20 min) refratária a repouso/nitratos, diaforese profusa, palidez, náuseas e vômitos, sensação de morte iminente, dispneia",termos:["dor retroesternal constritiva","irradiação para MSE e mandíbula","diaforese profusa","sudorese fria","palidez cutâneo-mucosa","náuseas","êmese","sensação de morte iminente","dispneia","pata de elefante no peito","suando frio em bicas","branco como papel","vômito","sensação de que vai morrer","falta de ar"]},atipicos:{descricao:"IAM silencioso, delirium em idosos, soluços incoercíveis (IAM inferior), choque cardiogênico ou PCR",termos:["isquemia silenciosa","delirium","singulto incoercível","soluços persistentes","epigastralgia","choque cardiogênico","hipotensão severa","parada cardiorrespiratória","soluço que não para","dor no estômago","idoso confuso","pressão despencou","desmaiou e parou de respirar"]}},{id:"fibrilacao-atrial-e-flutter-atrial",nome:"Fibrilação atrial e Flutter atrial",cid:"I48",sistema:"Cardiovascular",epidemiologia:'Prevalência aumenta exponencialmente com a idade (> 65-80 anos),portadores de HAS, insuficiência cardíaca, valvopatia mitral (estenose mitral reumática), hipertireoidismo, apneia do sono, obesidade, DPOC ou libação alcoólica aguda ("síndrome do coração pós-feriado").',exameFisico:'Ausculta cardíaca simultânea à palpação do pulso radial (identificar ritmo irregularmente irregular, intensidade variável de B1, ausência de onda "a" no pulso jugular e déficit de pulso / dissociação pulso-precórdio), aferição de PA, ausculta pulmonar e exame neurológico (descartar cardioembolismo).',obrigatorios:{descricao:"Ritmo cardíaco irregularmente irregular (FA) ou taquicárdico com dissociação pulso-precórdio",termos:["taquiarritmia","ritmo irregularmente irregular","arritmia cardíaca","dissociação pulso-precórdio","déficit de pulso","pulso arrítmico","coração fora de ritmo","coração batendo errado","pulso falhando"]},comuns:{descricao:"Palpitações taquicárdicas, fadiga, dispneia aos esforços, tontura, desconforto torácico leve",termos:["palpitações","taquicardia","astenia","fadiga","intolerância aos esforços","dispneia","tontura","pré-síncope","precordialgia atípica","batedeira no peito","coração disparado","coração pulando na garganta","cansaço","falta de ar","tonteira"]},atipicos:{descricao:"Evento cardioembólico agudo (AVCI ou isquemia de membro), síncope, hipotensão e edema agudo de pulmão",termos:["cardioembolismo","déficit neurológico focal","oclusão arterial aguda","síncope","instabilidade hemodinâmica","hipotensão","edema agudo de pulmão","derrame","perna fria e pálida de repente","desmaio","falta de ar grave"]}},{id:"taquicardia-paroxistica-supraventricular-tpsv",nome:"Taquicardia paroxística supraventricular (TPSV)",cid:"I47.1",sistema:"Cardiovascular",epidemiologia:"Jovens e adultos (15 a 50 anos), predomínio no sexo feminino (2:1 na taquicardia por reentrada nodal - TRN), frequentemente sem cardiopatia estrutural,desencadeada por cafeína, álcool, estresse, privação de sono ou síndrome de pré-excitação (Wolff-Parkinson-White).",exameFisico:'Avaliação de estabilidade hemodinâmica (PA, nível de consciência, perfusão), inspeção do pulso venoso jugular (pesquisa do "Sinal do Sapo" – ondas a em canhão regulares), ausculta cardíaca (taquicardia regular, geralmente > 150 bpm) e resposta clínica às manobras vagais (manobra de Valsalva modificada ou massagem do seio carotídeo após auscultar carótidas para excluir sopros).',obrigatorios:{descricao:'Taquicardia regular de início e término súbitos ("em liga-desliga")',termos:["taquicardia paroxística","palpitações taquicárdicas regulares","início súbito","coração disparou do nada","batedeira repentina","coração a mil por hora"]},comuns:{descricao:"Sensação de batimentos no pescoço (sinal do sapo), ansiedade, dispneia leve, tontura, mal-estar",termos:["sinal do sapo","pulsação jugular visível","palpitações cervicais","ansiedade","dispneia","tontura","vertigem","coração batendo no pescoço","veia do pescoço pulando","nervosismo","falta de ar","sensação de desmaio"]},atipicos:{descricao:"Poliúria durante/após a crise, síncope, angina hemodinâmica (dor torácica)",termos:["poliúria","diurese aquosa pós-crise","síncope","precordialgia hemodinâmica","angina","vontade de urinar muito após a batedeira","desmaio","dor no peito"]}},{id:"trombose-venosa-profunda-tvp",nome:"Trombose Venosa Profunda (TVP)",cid:"I80.2",sistema:"Cardiovascular",epidemiologia:"Idosos, gestantes e puérperas, usuárias de anticoncepcional oral combinado ou terapia hormonal, tabagistas, pacientes oncológicos (neoplasia ativa), pós-operatório recente (especialmente ortopédico de quadril/joelho), imobilização prolongada/acamados, viagens longas (> 4-6h) e trombofilias.",exameFisico:"Aplicação do Escore de Wells para TVP, mensuração comparativa da circunferência das panturrilhas com fita métrica (10 cm abaixo da tuberosidade tibial,diferença > 3 cm é significativa), palpação da musculatura gastrocnêmia (Sinal da Bandeira / empastamento), pesquisa dos sinais de Homans (dor na panturrilha à dorsiflexão do pé) e Bancroft (dor à compressão anteroposterior da panturrilha contra a tíbia) e palpação de pulsos distais.",obrigatorios:{descricao:"Alteração assimétrica do membro acometido (edema unilateral e/ou dor em trajeto venoso profundo)",termos:["edema unilateral de membro inferior","assimetria de panturrilhas","dor em membro inferior","trombose venosa","perna inchada de um lado só","batata da perna inchada","dor na perna"]},comuns:{descricao:"Empastamento muscular da panturrilha, dor à palpação profunda ou dorsiflexão do pé (Homans/Bancroft), calor local, eritema/cianose discreta, dilatação venosa superficial",termos:["empastamento de panturrilha","rigidez de gastrocnêmio","sinal de Homans positivo","sinal de Bancroft positivo","sinal da Bandeira positivo","calor local","eritema","circulação colateral superficial","batata da perna dura","perna pesada","perna quente","perna meio roxa","dor ao puxar a ponta do pé para cima"]},atipicos:{descricao:"Phlegmasia alba dolens (edema maciço e palidez) ou Phlegmasia cerulea dolens (cianose grave e dor isquêmica), apresentação direta como TEP",termos:["flegmasia alba dolens","flegmasia cerulea dolens","cianose maciça de membro","isquemia venosa","gangrena venosa","dispneia súbita","perna branca e muito inchada","perna toda roxa/preta e doendo muito"]}},{id:"tromboembolismo-pulmonar-tep",nome:"Tromboembolismo Pulmonar (TEP)",cid:"I26.9",sistema:"Cardiovascular",epidemiologia:"Mesmos fatores de risco da Tríade de Virchow/TVP: pós-operatório, trauma de membros inferiores/pelve, neoplasia ativa, gestação/puerpério, uso de estrogênios, imobilização, história prévia de TEV, obesidade e insuficiência cardíaca.",exameFisico:"Sinais vitais (SpO2, FC, FR, PA), aplicação dos Escores de Wells para TEP, Geneva e PERC, ausculta pulmonar (frequentemente limpa e desproporcional à hipoxemia/dispneia, ou com atrito pleural/estertores discretos), ausculta cardíaca (hiperfonese de B2 em foco pulmonar, B3 de VD), avaliação de turgência jugular e exame obrigatório das panturrilhas (sinais de TVP).",obrigatorios:{descricao:"Deterioração respiratória (dispneia/hipoxemia) e/ou hem ares","edema vespertino","estase venosa","veias saltadas nas pernas","vasinhos nas pernas","pernas inchadas no fim do dia"]},comuns:{descricao:"Peso, cansaço ou queimação nas pernas (piora no ortostatismo, melhora com elevação), prurido, cãibras noturnas, dermatite ocre",termos:["sensação de peso nas pernas","cansaço em MMII","queimação plantar/crural","prurido estásico","eczema de estase","cãibras noturnas","hiperpigmentação maleolar","dermatite ocre","pernas pesadas","pernas cansadas ao ficar em pé","coceira na canela","manchas escuras no tornozelo"]},atipicos:{descricao:"Varicorragia (sangramento agudo), lipodermatoesclerose, úlcera venosa maleolar medial, tromboflebite superficial",termos:["varicorragia","lipodermatoesclerose","atrofia branca de Milian","úlcera venosa","úlcera de estase","tromboflebite superficial","cordão venoso endurecido","veia estourou e sangrou muito","canela dura e fina","ferida no tornozelo que não fecha","veia inflamada e vermelha"]}},{id:"doenca-hemorroidaria-aguda",nome:"Doença hemorroidária aguda",cid:"K64.9",sistema:"Cardiovascular",epidemiologia:"Adultos (pico entre 45 e 65 anos), gestantes (compressão pélvica e efeito hormonal), portadores de constipação intestinal crônica com esforço evacuatório prolongado, dieta pobre em fibras, uso prolongado do assento sanitário, diarreia crônica e hipertensão portal/cirrose (varizes anorretais).",exameFisico:"Inspeção estática e dinâmica da região perianal (solicitar manobra de Valsalva/esforço evacuatório em posição de Sims ou genupeitoral para visualizar prolapso e classificar de Grau I a IV ou identificar trombose hemorroidária externa violácea), toque retal (excluir massas retais e avaliar tônus esfincteriano,evitar se trombose aguda extremamente dolorosa) e anuscopia.",obrigatorios:{descricao:"Sangramento anal rutilante, prolapso mucoso ou trombose aguda do plexo hemorroidário",termos:["hematoquezia rutilante","prolapso hemorroidário","trombose hemorroidária","mamilo hemorroidário","hemorroida","sangue vivo ao evacuar","bolinha no ânus","carocinho para fora do ânus"]},comuns:{descricao:"Sangue vivo no papel ou gotejando no vaso ao final da evacuação, dor perianal constante (na trombose), nódulo perianal arroxeado, prurido anal",termos:["sangramento perianal terminal","proctalgia","dor anal intensa","nódulo perianal violáceo","prurido anal","secreção mucoide perianal","sangue no papel higiênico","sangue pingando no vaso","dor para sentar","dor forte no ânus","coceira no ânus"]},atipicos:{descricao:"Anemia ferropriva crônica grave, estrangulamento e necrose de mamilo prolapsado com retenção urinária reflexa",termos:["anemia secundária","palidez","estrangulamento hemorroidário","necrose mucosa","retenção urinária aguda reflexa","fraqueza por perder sangue","hemorroida presa para fora e preta","não consegue fazer xixi de tanta dor"]}},{id:"sincope-e-colapso",nome:"Síncope e colapso",cid:"R55",sistema:"Cardiovascular",epidemiologia:"Distribuição bimodal: jovens de 10 a 30 anos (predomínio absoluto de síncope reflexa/vasovagal benigna) e idosos > 65 anos (alta prevalência de síncope cardiogênica/arrítmica, estenose aórtica e hipotensão ortostática por polifarmácia/anti-hipertensivos),história familiar de morte súbita (canalopatias/Brugada/QT longo/miocardiopatia hipertrófica).",exameFisico:"Medida da PA e FC em decúbito dorsal e após 1 e 3 minutos em ortostatismo (pesquisa de hipotensão ortostática: queda >= 20 mmHg na PAS ou >= 10 mmHg na PAD), ausculta cardíaca (pesquisar sopro sistólico ejetivo rude de estenose aórtica ou arritmias), palpação de pulsos carotídeos e periféricos, exame neurológico completo e inspeção da língua (mordedura lateral sugere crise epiléptica).",obrigatorios:{descricao:"Perda transitória da consciência e do tônus postural de início rápido, curta duração e recuperação espontânea e completa",termos:["síncope","perda transitória da consciência","perda do tônus postural","colapso","lipotimia","pré-síncope","desmaio","apagão","perdeu os sentidos e caiu","passamento","quase desmaiou"]},comuns:{descricao:"Pródromos autonômicos (diaforese fria, visão em túnel, náuseas, palidez), queda ao solo, pulso fraco/bradicárdico, fadiga pós-evento",termos:["pródromo vasovagal","diaforese fria","turvação visual","escurecimento visual","visão em túnel","náuseas","palidez cutânea","bradicardia","hipotensão","astenia pós-sincopal","vista escureceu","suor frio antes de cair","enjoo","ficou branco","acordou rápido no chão"]},atipicos:{descricao:"Síncope sem pródromos ou durante esforço/decúbito (cardiogênica), abalos mioclônicos breves (síncope convulsiva), trauma facial",termos:["síncope cardiogênica","síncope ao esforço","síncope sem pródromos","síncope convulsiva","mioclonias hipóxico-isquêmicas","trauma craniofacial secundário","desmaiou correndo","desmaiou sentado sem aviso","caiu duro e bateu o rosto","deu uns tremores rápidos quando desmaiou"]}},{id:"gastroenterite-e-colite-aguda-geca",nome:"Gastroenterite e colite aguda (GECA)",cid:"A09",sistema:"Digestivo e Hepatobiliar",epidemiologia:'Crianças < 5 anos (Rotavírus, Norovírus) e todas as idades em surtos alimentares/hídricos,saneamento básico precário, consumo de alimentos crus ou mal conservados (maionese, frutos do mar, aves), viagens recentes ("diarreia do viajante") ou uso recente de antibióticos (Clostridioides difficile).',exameFisico:"Avaliação rigorosa do grau de desidratação (Plano A, B ou C da OMS: estado geral, olhos fundos, lágrimas, sede, sinal da prega cutânea, tempo de enchimento capilar, pulso e PA), ausculta abdominal (RHA hiperativos) e palpação abdominal (difusamente dolorosa, mas sem defesa peritoneal ou Blumberg).",obrigatorios:{descricao:"Diarreia aguda (>= 3 dejeções líquidas/amolecidas em 24h) com duração < 14 dias",termos:["diarreia aguda","dejeções líquidas","aumento da frequência evacuatória","gastroenterite","enterocolite","diarreia","intestino solto","fezes líquidas","fazendo cocô igual água","dor de barriga com diarreia","virose intestinal"]},comuns:{descricao:"Náuseas, vômitos, dor abdominal em cólica difusa, ruídos hidroaéreos hiperativos (borborigmos), febre baixa a moderada, mal-estar",termos:["náuseas","êmese","vômitos","cólica abdominal","dor abdominal difusa","borborigmos","ruídos hidroaéreos aumentados","pirexia","febre","astenia","enjoo","vômito","cólica na barriga","barriga roncando muito","corpo fraco"]},atipicos:{descricao:"Disenteria (fezes com sangue, muco e pus + tenesmo), desidratação grave com choque, íleo paralítico por hipocalemia",termos:["disenteria","hematoquezia","muco nas fezes","piócitos nas fezes","tenesmo retal","desidratação grave","hipovolemia","distensão abdominal","íleo adinâmico","diarreia com sangue","catarro nas fezes","vontade de evacuar toda hora mas não sai nada","boca seca","barriga inchada e parada"]}},{id:"doenca-do-refluxo-gastroesofagico-drge",nome:"Doença do Refluxo Gastroesofágico (DRGE)",cid:"K21.9",sistema:"Digestivo e Hepatobiliar",epidemiologia:"Adultos > 40 anos, obesos e sobrepeso, gestantes (aumento da pressão intra-abdominal e relaxamento do EEI pela progesterona), tabagistas, etilistas, portadores de hérnia de hiato, esclerodermia, consumidores excessivos de café, chocolate, gorduras e refeições volumosas noturnas.",exameFisico:"Exame físico geralmente normal,inclui cálculo do IMC e circunferência abdominal, oroscopia (hiperemia de faringe posterior, erosão ácida do esmalte dentário lingual), ausculta pulmonar (se queixa de tosse/broncoespasmo reflexo) e palpação epigástrica (excluir massas ou visceromegalias).",obrigatorios:{descricao:"Pirose e/ou regurgitação ácida/alimentar recorrentes",termos:["pirose","queimação retroesternal","regurgitação ácida","refluxo gastroesofágico","azia","queimação no peito","queimação subindo até a garganta","comida voltando na boca","líquido azedo voltando"]},comuns:{descricao:"Piora pós-prandial e em decúbito dorsal, eructações frequentes, dor epigástrica, dispepsia",termos:["piora em decúbito","piora ástrica: adultos mais velhos e idosos (50 a 70 anos). Fatores de risco: infecção por H. pylori, uso crônico de AINEs/AAS (principal causa em idosos), tabagismo, etilismo e história familiar.",exameFisico:'Sinais vitais, inspeção de mucosas (palidez), palpação epigástrica,na suspeita de perfuração: pesquisa de defesa muscular involuntária ("abdome em tábua"), descompressão brusca dolorosa difusa e percussão do hipocôndrio direito (Sinal de Jobert: timpanismo substituindo a macicez hepática por pneumoperitônio),toque retal se suspeita de melena.',obrigatorios:{descricao:'Dor epigástrica em queimação ou corrosiva ("em fome"), episódica e rítmica, ou apresentação direta por complicação',termos:["epigastralgia rítmica","síndrome ulcerosa","dor epigástrica urente","dor em queimação","dor forte no estômago","estômago roendo","ferida no estômago"]},comuns:{descricao:"Ritmicidade alimentar (dói-come-passa na duodenal,come-dói na gástrica), dor noturna que desperta o paciente (23h-2h), náuseas, pirose",termos:["clocking noturno","despertar noturno por dor","alívio pós-prandial","agravamento pós-prandial","náuseas","pirose","acorda de madrugada com dor no estômago","dor melhora quando come ou toma leite","dor piora quando come"]},atipicos:{descricao:"Abdome agudo perfurativo (dor lancinante súbita, abdome em tábua, sinal de Jobert +) ou hemorragia digestiva alta maciça",termos:["abdome agudo perfurativo","dor epigástrica em punhalada","abdome em tábua","rigidez abdominal involuntária","sinal de Jobert positivo","pneumoperitônio","hematêmese","melena","dor súbita insuportável na barriga","barriga dura igual pedra","vômito com sangue","fezes pretas"]}},{id:"apendicite-aguda",nome:"Apendicite aguda",cid:"K35.8",sistema:"Digestivo e Hepatobiliar",epidemiologia:"Adolescentes e adultos jovens (pico entre 10 e 30 anos), discreto predomínio masculino,em crianças pequenas e idosos a apresentação costuma ser tardia com maior taxa de perfuração.",exameFisico:"Ausculta abdominal (RHA redu obesidade/sobrepeso ou perda ponderal rápida pós-bariátrica/uso de análogos de GLP-1) e Fertile (multíparas, gestantes ou uso de estrogênios),portadores de anemias hemolíticas (cálculos pigmentares pretos).',exameFisico:"Inspeção de escleras e pele (pesquisar icterícia), pesquisa do Sinal de Murphy (interrupção súbita da inspiração profunda devido à dor durante a compressão do ponto cístico no hipocôndrio direito), palpação de massa/vesícula distendida em HCD e pesquisa de sinais de peritonite., Dor biliar em hipocôndrio direito ou epigástrio",obrigatorios:{descricao:"na colecistite aguda: dor contínua (> 6h) com sinal de Murphy positivo e/ou febre",termos:["cólica biliar","dor em hipocôndrio direito","epigastralgia","sinal de Murphy positivo","interrupção inspiratória à palpação do ponto cístico","dor debaixo da costela direita","dor no fígado","pedra na vesícula","vesícula inflamada"]},comuns:{descricao:"Dor desencadeada por ingesta gordurosa, irradiação para escápula direita ou ombro direito (sinal de Kehr), náuseas, vômitos biliosos, febre, defesa em HCD",termos:["intolerância a colecistocinéticos","dor pós-prandial gordurosa","irradiação escapular direita","irradiação para ombro direito","náuseas","vômitos biliosos","pirexia","vesícula palpável","dor após comer fritura/gordura","dor que vai para as costas e ombro direito","vômito amarelo/verde amargo","febre"]},atipicos:{descricao:"Icterícia obstrutiva (Mirizzi ou coledocolitíase associada: colúria e acolia), íleo biliar (obstrução intestinal), perfuração vesicular com peritonite biliar",termos:["icterícia","colúria","acolia fecal","síndrome de Mirizzi","coledocolitíase","colangite","tríade de Charcot","íleo biliar","olho amarelo","pele amarela","urina cor de coca-cola","fezes brancas"]}},{id:"pancreatite-aguda",nome:"Pancreatite aguda",cid:"K85.9",sistema:"Digestivo e Hepatobiliar",epidemiologia:"Adultos de 30 a 60 anos,mulheres (predomina etiologia biliar por microcálculos), homens (predomina etiologia alcoólica crônica ou após libação),portadores de hipertrigliceridemia severa (> 1000 mg/dL), pós-CPRE recente ou uso de fármacos (azatioprina, valproato, tiazídicos).",exameFisico:"Sinais vitais e avaliação de SIRS/choque, ausculta pulmonar (pesquisar derrame pleural à esquerda), inspeção abdominal (distensão e pesquisa dos sinais de hemorragia retroperitoneal: Sinal de Cullen periumbilical, Sinal de Grey-Turner nos flancos e Sinal de Fox inguinal), ausculta abdominal (RHA abolidos/reduzidos) e palpação epigástrica.",obrigatorios:{descricao:'Dor abdominal aguda intensa em andar superior (epigástrio/hipocôndrios), tipicamente irradiada "em faixa" ou "em barra" para o dorso',termos:["dor epigástrica em faixa","dor abdominal em barra","irradiação dorsal transfixante","abdome agudo inflamatório","dor forte na boca do estômago que vai para as costas","dor atravessando a barriga"]},comuns:{descricao:"Náuseas e vômitos incoercíveis (que não aliviam a dor), distensão abdominal, redução de RHA (íleo paralítico), posição de prece maometana, taquicardia, febre",termos:["êmese incoercível","vômitos persistentes","distensão abdominal","íleo adinâmico","sinal da prece maometana","posição genupeitoral","taquicardia","febre","vômitos que não param","vomita e a dor não melhora","barriga inchada","alivia quando dobra o corpo para frente"]},atipicos:{descricao:"Sinais de Cullen (equimose periumbilical), Grey-Turner (equimose em flancos) e Fox, choque precoce, derrame pleural à esquerda, tetania hipocalcêmica",termos:["sinal de Cullen","sinal de Grey-Turner","sinal de Fox","equimose retroperitoneal","choque distributivo","hipotensão","derrame pleural","sinal de Trousseau","sinal de Chvostek","mancha roxa ao redor do umbigo","mancha roxa na lateral da barriga","falta de ar","pressão baixa"]}},{id:"diverticulite-aguda",nome:"Diverticulite aguda",cid:"K57.3",sistema:"Digestivo e Hepatobiliar",epidemiologia:"Adultos > 50 anos e idosos (crescente em jovens obesos < 40 anos),antecedente de doença morfina, tramadol, codeína), antidepressivos tricíclicos ou bloqueadores dos canais de cálcio.",exameFisico:"Inspeção e percussão abdominal (distensão e submacicez em trajeto colônico esquerdo), palpação profunda da fossa ilíaca esquerda (cordão sigmoideo preenchido por massas fecais moldáveis, Sinal de Gersuny positivo no fecaloma), inspeção anal (fissuras/hemorroidas) e toque retal obrigatório (ampola retal preenchida por massa fecal endurecida/pétrea ou vazia nas obstruções altas).",obrigatorios:{descricao:"Redução da frequência evacuatória (< 3x/semana) e/ou esforço evacuatório excessivo com fezes endurecidas (Bristol 1-2) ou impacto fecal",termos:["constipação intestinal","obstipação","fezes em cíbalos","escala de Bristol 1","esforço evacuatório","fecaloma","impactação fecal","intestino preso","prisão de ventre","ressecamento","muitos dias sem fazer cocô","fezes em bolinhas duras","fezes empedradas"]},comuns:{descricao:"Distensão e desconforto abdominal em cólica, flatulência, massa fecal moldável em sigmoide, dor anal ao defecar, ampola retal cheia de fezes pétreas ao toque",termos:["distensão abdominal","meteorismo","flatulência","cólica abdominal","sensação de evacuação incompleta","massa fecal palpável","ampola retal preenchida","barriga inchada","muitos gases","sensação de que não esvaziou tudo","dor para evacuar"]},atipicos:{descricao:"Diarreia paradoxal (incontinência por transbordamento ao redor do fecaloma), retenção urinária aguda compressiva, delirium em idosos, sangramento estercoral",termos:["diarreia paradoxal","incontinência por transbordamento","encoprese","retenção urinária aguda","delirium","úlcera estercoral","saindo água suja de fezes na fralda mas está ressecado","idoso agitado e confuso","não consegue urinar"]}},{id:"sindrome-do-intestino-irritavel-sii",nome:"Síndrome do Intestino Irritável (SII)",cid:"K58.9",sistema:"Digestivo e Hepatobiliar",epidemiologia:"Adolescentes e adultos jovens (< 45 anos), forte predomínio no sexo feminino (2:1),comorbidade frequente com transtorno de ansiedade, depressão, fibromialgia, enxaqueca, dispepsia funcional ou antecedente de gastroenterite infecciosa aguda (SII pós-infecciosa).",exameFisico:"Exame físico abdominal (frequentemente normal ou apenas com timpanismo difuso à percussão e dor leve à palpação profunda da moldura colônica/sigmoide palpável espástico, sem visceromegalias, massas ou sinais de irritação peritoneal) e verificação de peso corporal estável.",obrigatorios:{descricao:"Dor abdominal recorrente associada à evacuação e à mudança na frequência ou forma/consistência das fezes (sem sinais de alarme)",termos:["dor abdominal crônica","cólica abdominal recorrente","alteração do hábito intestinal","alívio ou piora da dor com a defecação","dor de barriga que melhora depois de ir ao banheiro","intestino irritável"]},comuns:{descricao:"Distensão abdominal diurna progressiva, flatulência, alternância entre diarreia e constipação, muco claro nas fezes, sensação de esvaziamento incompleto",termos:["distensão abdominal funcional","meteorismo","flatulência","alternância diarreia-constipação","muco fecal","tenesmo funcional","barriga acorda reta e incha ao longo do dia","excesso de gases","ora prende ora solta","baba branca nas fezes","nervoso ataca o intestino"]},atipicos:{descricao:"Hipersensibilidade visceral grave simulando abdome agudo, dispareunia, associação com fibromialgia e dispepsia",termos:["hipersensibilidade visceral","dor pélvica crônica","dispareunia","náuseas","refluxo associado","cólica intestinal muito forte","dor na barriga toda quando fica estressado"]}},{id:"hernia-inguinal-ou-umbilical",nome:"Hérnia inguinal ou umbilical",cid:"K40.9",sistema:"Digestivo e Hepatobiliar",epidemiologia:"Hérnia inguinal: forte predomínio masculino (8:1), bimodal (lactentes/prematuros por persistência do conduto peritoniovaginal e adultos > 50 anos). Hérnia umbilical: lactentes, multíparas, obesos e cirróticos com ascite. Fatores de risco: aumento crônico da pressão intra-abdominal (tosse crônica/DPOC, constipação, prostatismo/HPB, trabalhadores braçais) e tabagismo.",exameFisico:"Inspeção e palpação da região inguinal e umbilical com o paciente em pé (ortostatismo) e deitado, solicitando a Manobra de Valsalva (tossir ou soprar contra o dorso da mão),invaginação da pele escrotal com o dedo indicador pelo anel inguinal superficial (Manobra de Landivar/Taxe) para avaliar redutibilidade, tamanho do colo herniário e excluir sinais de encarceramento/estrangulamento (tensão, dor extrema, hiperemia).",obrigatorios:{descricao:"Protrusão ou abaulamento na região inguinal, inguinoescrotal ou umbilical através de defeito aponeurótico",termos:["abaulamento inguinal","abaulamento umbilical","protrusão herniária","anel herniário palpável","hérnia inguinoescrotal","caroço na virilha","bola na virilha","umbigo estufado","bola no saco escrotal"]},comuns:{descricao:"Abaulamento que aumenta com manobra de Valsalva, tosse ou ortostatismo e reduz ao decúbito/compressão manual, desconforto ou dor em peso aos esforços",termos:["hérnia redutível","impulsão positiva à manobra de Valsalva","dor inguinal aos esforços","sensação de peso inguinal","bola que aparece quando tosse ou pega peso","caroço que some quando deita","dor na virilha ao fazer força"]},atipicos:{descricao:"Abaulamento tenso, irredutível e muito doloroso, hiperemia cutânea, parada de eliminação de gases/fezes e vômitos (encarceramento/estrangulamento)",termos:["hérnia encarcerada","hérnia estrangulada","abaulamento irredutível","abdome agudo obstrutivo","parada de eliminação de flatos e fezes","vômitos fecaloides","sofrimento isquêmico","hérnia presa","bola na virilha ficou dura","roxa e não volta para dentro","dor insuportável na virilha","barriga inchada e vomitando"]}},{id:"hemorragia-digestiva-alta-hda",nome:"Hemorragia digestiva alta (HDA)",cid:"K92.2",sistema:"Digestivo e Hepatobiliar",epidemiologia:"Adultos e idosos (> 60 anos),usuários crônicos de AINEs, AAS, anticoagulantes ou antiagregantes plaquetários, portadores de úlcera péptica/H. pylori, etilistas crônicos e hepatopatas/cirróticos ou portadores de esquistossomose mansônica (hipertensão portal com ruptura de varizes esofagogástricas).",exameFisico:"Avaliação hemodinâmica imediata (PA, FC, Tilt Test / hipotensão postural, tempo de enchimento capilar, cor de mucosas), inspeção de estigmas de hepatopatia crônica (icterícia, aranhas vasculares/telangiectasias, eritema palmar, circulação colateral em cabeça de medusa, ascite, esplenomegalia, flapping) e toque retal obrigatório (confirmar presença de melena ou sangue vivo em dedo de luva).",obrigatorios:{descricao:'Exteriorização de sangramento digestivo alto por hematêmese (sangue vivo ou "borra de café") e/ou melena',termos:["hematêmese","vômito em borra de café","melena","hemorragia digestiva alta","sangramento gastrointestinal superior","vômito com sangue","vomitou sangue vivo","vômito preto parecendo pó de café","fezes pretas como piche","cocô preto com cheiro de sangue podre"]},comuns:{descricao:"Náuseas, epigastralgia, tontura postural, lipotimia, palidez cutâneo-mucosa acentuada, taquicardia sinusal, hipotensão ortostática",termos:["náuseas","epigastralgia","tontura ortostática","lipotimia","síncope","palidez cutâneo-mucosa","hipocoramento","taquicardia","hipotensão postural","sudorese fria","enjoo","dor no estômago","tonteira ao levantar","desmaio","muito pálido","coração disparado"]},atipicos:{descricao:"Enterorragia/hematoquezia maciça com choque hipovolêmico (trânsito rápido), encefalopatia hepática precipitada pelo sangramento (cirróticos)",termos:["enterorragia maciça","hematoquezia de origem alta","choque hipovolêmico","instabilidade hemodinâmica","encefalopatia hepática","flapping","ascite","estigmas de hepatopatia crônica","evacuando muito sangue puro e desmaiando","confusão mental"]}},{id:"infeccao-do-trato-urinario-baixo-cistite",nome:"Infecção do Trato Urinário baixo (Cistite)",cid:"N30.0",sistema:"Geniturinário e GO",epidemiologia:'Predomínio absoluto no sexo feminino (uretra curta e proximidade perineal), especialmente mulheres jovens sexualmente ativas ("cistite da lua de mel"), gestantes e mulheres pós-menopausa (hipoestrogenismo/atrofia urogenital),em homens, associada a HPB, instrumentalização uretral/sondagem vesical ou cálculo.',exameFisico:"Sinais vitais (ausência de febre/taquicardia), palpação abdominal profunda em região suprapúbica/hipogástrica (dor vesical localizada), Manobra de Giordano (punho-percussão lombar obrigatoriamente negativa para excluir pielonefrite) e inspeção vulvar/vaginal se houver queixa associada de corrimento ou prurido.",obrigatorios:{descricao:"Sintomas irritativos vesicais agudos (disúria, polaciúria ou urgência miccional) sem febre ou dor lombar",termos:["disúria","polaciúria","urgência miccional","estrangúria","cistite aguda","ardência para urinar","dor para fazer xixi","queimação ao urinar","indo ao banheiro toda hora fazer pinguinhos","vontade urgente de urinar"]},comuns:{descricao:"Dor ou peso suprapúbico, urina turva e com odor fétido, hematúria macroscópica terminal ou microscópica, noctúria",termos:["dor suprapúbica","dor hipogástrica","tenesmo vesical","piúria","urina fétida","urina turva","hematúria terminal","noctúria","dor no pé da barriga","sensação de bexiga sempre cheia","urina com cheiro forte","urina escura/suja","sangue no final do xixi"]},atipicos:{descricao:"Confusão mental aguda/delirium, letargia, incontinência urinária aguda ou quedas sem queixa de disúria (idosos frágeis)",termos:["delirium","estado confusional agudo","incontinência urinária aguda","queda da própria altura","prostração em idoso","hiporexia","idoso ficou confuso de repente","começou a perder urina na roupa","idoso muito sonolento"]}},{id:"pielonefrite-aguda",nome:"Pielonefrite aguda",cid:"N10",sistema:"Geniturinário e GO",epidemiologia:"Mulheres em idade fértil, gestantes (dilatação pielocalicial fisiológica, maior à direita), diabéticos, imunossuprimidos, portadores de nefrolitíase obstrutiva, refluxo vesicoureteral (crianças), bexiga neurogênica ou hiperplasia prostática.",exameFisico:"Sinais vitais e triagem de sepse (qSOFA: PA, FR, nível de consciência, Tax, FC), Sinal de Giordano (punho-percussão dolorosa nos ângulos costovertebrais/região lombar), palpação abdominal e avaliação dos pontos ureterais (superior e médio).",obrigatorios:{descricao:"Febre/calafrios e dor lombar/costovertebral (ou sinal de Giordano positivo) associados a quadro urinário/bacteriúria",termos:["pirexia","febre alta","calafrios","dor lombar unilateral","dor costovertebral","sinal de Giordano positivo","punho-percussão lombar dolorosa","pielonefrite","febre com tremedeira","dor nos rins","dor nas costas de um lado","dor forte quando bate nas costas"]},comuns:{descricao:"Náuseas e vômitos, queda do estado geral, taquicardia, disúria e polaciúria precedendo ou acompanhando o quadro sistêmico",termos:["náuseas","êmese","vômitos","astenia","prostração","taquicardia","disúria","polaciúria","hematúria","piúria","enjoo","vômito","corpo muito fraco","ardência para urinar","infecção de urina que subiu para o rim"]},atipicos:{descricao:"Sepse/choque séptico urinário, íleo paralítico reflexo (distensão abdominal), crepitação lombar (pielonefrite enfisematosa em diabéticos)",termos:["urosepse","choque séptico","hipotensão arterial","delirium","íleo adinâmico reflexo","distensão abdominal","pielonefrite enfisematosa","pressão muito baixa","confusão mental","barriga inchada"]}},{id:"nefrolitiase-colica-nefretica",nome:"Nefrolitíase / Cólica nefrética",cid:"N20.0",sistema:"Geniturinário e GO",epidemiologia:"Adultos de 20 a 50 anos, predomínio no sexo masculino (2:1),história pessoal ou familiar de litíase renal, baixa ingesta hídrica, clima quente/verão, trabalhadores expostos ao calor, dieta rica em sódio e proteína animal, obesidade, gota/hiperuricemia e hiperparatireoidismo.",exameFisico:"Observação da atitude do paciente (inquietação extrema, caminhando ou contorcendo-se sem achar posição antálgica, diferentemente da imobilidade da peritonite), sinais vitais (monitorar febre para excluir pionefrose/pielonefrite obstrutiva), Sinal de Giordano (geralmente positivo no lado afetado), palpação abdominal (ausência de irritação peritoneal,excluir aneurisma de aorta abdominal pulsátil em idosos > 60 anos com primeiro episódio de dor lombar).",obrigatorios:{descricao:"Dor lombar aguda, unilateral, de início súbito e caráter em cólica (paroxística) de forte intensidade",termos:["cólica nefrética","cólica ureteral","dor lombar aguda intensa","nefrolitíase","ureterolitíase","dor de pedra no rim","dor insuportável nas costas","crise de rim"]},comuns:{descricao:"Irradiação pelo flanco até fossa ilíaca, região inguinal e testículo/grandes lábios, inquietação psicomotora, náuseas, vômitos, hematúria, Giordano positivo",termos:["irradiação flanco-inguinal","irradiação para genitália ipsilateral","dor testicular referida","agitação psicomotora","inquietação antálgica","náuseas","êmese","hematúria macroscópica","hematúria microscópica","sinal de Giordano positivo","dor que desce das costas para a virilha e testículo/vagina","não acha posição que melhore a dor","vômito","urina com sangue","urina cor de chá/avermelhada"]},atipicos:{descricao:"Polaciúria e urgência sem dor lombar (cálculo justavesical), anúria aguda (obstrução de rim único), febre alta associada (pielonefrite obstrutiva)",termos:["disúria","urgência miccional","estrangúria","anúria obstrutiva","oligúria","pielonefrite obstrutiva","pionefrose","febre com calafrios","vontade de urinar toda hora","parou de sair urina totalmente","cólica de rim com febre alta"]}},{id:"hiperplasia-prostatica-benigna-hpb-retencao",nome:"Hiperplasia Prostática Benigna (HPB) / Retenção",cid:"N40",sistema:"Geniturinário e GO",epidemiologia:"Homens > 50 anos (prevalência > 50% aos 60 anos e > 80% aos 80 anos),retenção urinária aguda precipitada pelo uso de medicamentos anticolinérgicos, anti-histamínicos, descongestionantes nasais simpatomiméticos (pseudoefedrina/fenilefrina), opioides, consumo de álcool ou exposição ao frio.",exameFisico:"Palpação e percussão da região hipogástrica/suprapúbica (identificar bexigoma/globo vesical tenso, maciço e doloroso na retenção urinária aguda) e toque retal (avaliar volume prostático em gramas/polpas digitais, consistência fibroelástica vs. pétrea/nodular suspeita de adenocarcinoma, limites laterais, apagamento do sulco mediano e ausência de dor aguda que sugeriria prostatite).",obrigatorios:{descricao:"Sintomas do trato urinário inferior (LUTS) obstrutivos/irritativos ou incapacidade aguda de urinar com globo vesical palpável",termos:["sintomas do trato urinário inferior","LUTS","prostatismo","retenção urinária aguda","bexigoma palpável","globo vesical","hiperplasia prostática","próstata aumentada","não consegue urinar","urina trancou","bexiga cheia e travada"]},comuns:{descricao:"Jato urinário fraco/afilado, hesitação, esforço miccional, intermitência, gotejamento terminal, esvaziamento incompleto, noctúria, polaciúria",termos:["jato urinário fraco","hesitação miccional","esforço miccional","jato intermitente","gotejamento terminal","sensação de esvaziamento vesical incompleto","noctúria","polaciúria","próstata fibroelástica aumentada","xixi sem força","demora para o xixi começar a sair","tem que fazer força para urinar","xixi corta e volta","fica pingando no final","acorda várias vezes à noite para urinar"]},atipicos:{descricao:"Incontinência paradoxal por transbordamento, hematúria macroscópica, uremia pós-renal, agitação psicomotora em idosos demenciados",termos:["incontinência por transbordamento","isquiúria paradoxal","hematúria prostática","hidronefrose bilateral","injúria renal pós-renal","agitação psicomotora","bexiga cheia mas fica vazando pinguinhos na cueca","urina com sangue","idoso muito agitado segurando a barriga"]}},{id:"uretrite-infecciosa",nome:"Uretrite infecciosa",cid:"N34.1",sistema:"Geniturinário e GO",epidemiologia:"Adolescentes e adultos jovens sexualmente ativos (15 a 35 anos), predomínio sintomático no sexo masculino,múltiplos parceiros sexuais, nova parceria recente, não uso de preservativo e histórico prévio de ISTs.",exameFisico:"Inspeção do pênis, glande e meato uretral externo (eritema, edema, crostas), ordenha uretral delicada da base do pênis até a glande (caso o corrimento não seja visível espontaneamente, idealmente com > 2h sem urinar), palpação testicular/epididimária e palpação de cadeias linfonodais inguinais.",obrigatorios:{descricao:"Corrimento uretral (purulento, mucopurulento ou mucoide) e/ou disúria aguda em paciente sexualmente ativo",termos:["corrimento uretral","secreção uretral purulenta","descarga uretral mucoide","disúria","uretrite gonocócica","uretrite não-gonocócica","pus saindo pelo pênis","secreção amarela/branca no canal da urina","cueca manchada de pus","ardência forte na ponta do pênis ao urinar","gonorreia","esquentamento"]},comuns:{descricao:"Prurido uretral no meato, eritema e edema do meato uretral externo, disúria inicial, polaciúria",termos:["prurido uretral","hiperemia de meato uretral","edema de meato acústico urinário","disúria inicial","polaciúria","coceira dentro do canal do pênis","ponta do pênis vermelha e inchada","dor logo que começa a sair o xixi"]},atipicos:{descricao:"Síndrome de Reiter / Artrite reativa (uretrite + conjuntivite + oligoartrite), epididimite ou prostatite aguda",termos:["artrite reativa","síndrome de Reiter","oligoartrite assimétrica","conjuntivite bilateral","orquiepididimite secundária","prostatite aguda","dor e inchaço no joelho/tornozelo e olho vermelho junto com o corrimento"]}},{id:"orquiepididimite-aguda",nome:"Orquiepididimite aguda",cid:"N45.9",sistema:"Geniturinário e GO",epidemiologia:"Jovens < 35 anos sexualmente ativos (etiologia por IST: Chlamydia trachomatis e Neisseria gonorrhoeae),homens > 35 anos e idosos (etiologia por enterobactérias urinárias, como E. coli, secundária a obstrução infravesical/HPB ou manipulação urológica),crianças/adolescentes não vacinados (orquite viral por Caxumba).",exameFisico:"Inspeção e palpação da bolsa escrotal, testículos, epidídimos e cordão espermático, pesquisa do Sinal de Prehn (elevação manual do testículo alivia a dor na orquiepididimite, mas não alivia na torção testicular), pesquisa do Reflexo Cremastérico (estímulo na face medial da coxa eleva o testículo ipsilateral,preservado na orquiepididimite e abolido na torção), verificação da posição testicular (excluir Sinal de Angell / testículo horizontalizado) e transiluminação escrotal.",obrigatorios:{descricao:"Dor escrotal aguda/subaguda unilateral associada a edema e hipersensibilidade palpável do epidídimo e/ou testículo",termos:["dor testicular aguda","dor escrotal","orquialgia","edema epididimário","orquiepididimite","dor no testículo","saco escrotal inchado e doendo","testículo inflamado"]},comuns:{descricao:"Aumento do volume hemiescrotal, calor e eritema escrotal, Sinal de Prehn positivo, reflexo cremastérico presente, febre, disúria/corrimento uretral",termos:["eritema escrotal","calor local em bolsa escrotal","sinal de Prehn positivo","reflexo cremastérico preservado","hidrocele reacional","pirexia","disúria","corrimento uretral","bolsa escrotal vermelha e quente","dor melhora quando levanta/apoia o testículo","febre","ardência para urinar"]},atipicos:{descricao:"Abscesso escrotal com flutuação, infarto testicular,(Diferencial com Torção Testicular: Prehn negativo, testículo elevado, cremastérico abolido)",termos:["abscesso testicular","flutuação escrotal","sinal de Prehn negativo","reflexo cremastérico abolido","sinal de Brunzel","testículo elevado","dor súbita explosiva no testículo","testículo subiu"]}},{id:"candidiase-vulvovaginal",nome:"Candidíase vulvovaginal",cid:"B37.3",sistema:"Geniturinário e GO",epidemiologia:"Mulheres no menacme (idade reprodutiva),fatores desencadeantes: gestação, uso recente de antibióticos de amplo espectro, diabetes mellitus descompensado (ou uso de inibidores de SGLT2), uso de anticoncepcionais de alta dosagem estrogênica, corticoterapia/imunossupressão e roupas íntimas sintéticas/abafamento local.",exameFisico:"Inspeção da genitália externa (hiperemia, edema de pequenos e grandes lábios, fissuras e escoriações por coçadura), exame especular (placas brancas grumosas aderidas às paredes vaginais e ectocérvice, sem odor fétido) e aferição do pH vaginal com fita (mantém-se ácido, < 4,5).",obrigatorios:{descricao:'Prurido vulvovaginal intenso e/ou corrimento vaginal branco, grumoso ("leite talhado") e inodoro',termos:["prurido vulvovaginal","leucorreia grumosa","corrimento em placas aderentes","aspecto de leite coalhado","candidíase","coceira intensa na vagina","corrimento branco igual nata/coalhada","corrimento sem cheiro"]},comuns:{descricao:"Hiperemia e edema vulvar, ardor vulvar, dispareunia superficial (de introito), disúria externa, pH vaginal < 4,5",termos:["hiperemia vulvar","edema de pequenos lábios","ardor vulvovaginal","dispareunia superficial","disúria terminal/externa","escoriações por coçadura","vagina muito vermelha e inchada","ardência quando o xixi encosta na pele","dor na entrada da vagina na relação"]},atipicos:{descricao:"Fissuras vulvares extensas sem corrimento visível (candidíase eritematosa), balanopostite no parceiro",termos:["fissuras vulvares","candidíase vulvar eritematosa","balanopostite candidiásica","cortes/rachaduras na vulva","assadura vaginal","manchas vermelhas e coceira na cabeça do pênis do parceiro"]}},{id:"vaginose-bacteriana-e-tricomoniase",nome:"Vaginose bacteriana e Tricomoníase",cid:"N76.0",sistema:"Geniturinário e GO",epidemiologia:"Mulheres em idade reprodutiva sexualmente ativas,múltiplos ou novos parceiros sexuais, não uso de preservativo (Tricomoníase é IST estrita), tabagismo, prática de duchas vaginais e ausência de lactobacilos vaginais.",exameFisico:'Exame especular (avaliar aspecto do conteúdo vaginal: homogêneo acinzentado na VB vs. amarelo-esverdeado bolhoso na Tricomoníase,inspecionar o colo uterino em busca de colpite macular / "colo em framboesa" ou Teste de Schiller em "pele de onça" na Tricomoníase), aferição do pH vaginal (> 4,5 em ambas) e Teste das Aminas / Whiff Test (pingar KOH 10% na secreção para exalar odor de peixe podre).',obrigatorios:{descricao:"Corrimento vaginal anormal com elevação do pH vaginal (> 4,5) e odor fétido (VB) ou aspecto amarelo-esverdeado bolhoso (Tricomoníase)",termos:["leucorreia fétida","corrimento acinzentado homogêneo","corrimento amarelo-esverdeado bolhoso","vaginose bacteriana","tricomoníase","corrimento com cheiro forte","corrimento cheirando a peixe podre","corrimento amarelo/verde com bolhas"]},comuns:{descricao:"Na VB: teste de Whiff positivo, piora do odor após coito, clue cells. Na Tricomoníase: prurido/ardor intenso, dispareunia e colpite macular (colo em framboesa)",termos:["teste de Whiff positivo","odor de aminas voláteis","clue cells","colpite macular","colo uterino em framboesa","colo em morango","prurido vulvovaginal","dispareunia","disúria","mau cheiro que piora depois da relação sexual","coceira e ardência vaginal"]},atipicos:{descricao:"Sinusorragia (sangramento pós-coito por friabilidade cervical na tricomoníase), dor pélvica leve",termos:["sinusorragia","sangramento pós-coito","friabilidade cervical","desconforto hipogástrico","sangramento depois da relação sexual","dorzinha no pé da barriga"]}},{id:"doenca-inflamatoria-pelvica-dip",nome:"Doença Inflamatória Pélvica (DIP)",cid:"N73.9",sistema:"Geniturinário e GO",epidemiologia:"Mulheres jovens sexualmente ativas (15 a 29 anos),múltiplos parceiros sexuais, não uso de preservativo, episódio prévio de DIP ou cervicite por Gonococcus/Chlamydia, e inserção recente de DIU (primeiras 3 semanas).",exameFisico:"Sinais vitais, palpação abdominal (dor em hipogástrio e fossas ilíacas, avaliar Blumberg e hipocôndrio direito), exame especular (visualizar secreção mucopurulenta fluindo pelo orifício cervical externo e friabilidade cervical) e toque vaginal bimanual obrigatório (pesquisar dor intensa à mobilização lateral do colo uterino – Sinal do Candelabro, dor uterina e dor/massa palpável nas regiões anexiais).",obrigatorios:{descricao:"Dor pélvica/hipogástrica associada a dor à mobilização do colo uterino e/ou dor à palpação uterina ou anexial ao toque bimanual",termos:["dor pélvica aguda","dor hipogástrica","dor à mobilização cervical","sinal do candelabro positivo","dor à palpação anexial","anexite","salpingite","dor forte no pé da barriga","dor intensa no exame de toque ginecológico"]},comuns:{descricao:"Corrimento endocervical mucopurulento, febre (> 38,3°C), dispareunia de profundidade, sangramento uterino intermenstrual, defesa hipogástrica",termos:["cervicite mucopurulenta","leucorreia purulenta","pirexia","febre","dispareunia de profundidade","metrorragia","sinusorragia","defesa abdominal inferior","corrimento amarelo com pus","dor lá no fundo durante a relação sexual","sangramento fora de época"]},atipicos:{descricao:"Dor pleurítica em hipocôndrio direito (Síndrome de Fitz-Hugh-Curtis / peri-hepatite), massa anexial e sepse (abscesso tubo-ovariano roto)",termos:["síndrome de Fitz-Hugh-Curtis","peri-hepatite","dor em hipocôndrio direito","massa anexial palpável","abscesso tubo-ovariano","peritonite pélvica","choque séptico","dor debaixo da costela direita junto com dor pélvica","barriga toda dura"]}},{id:"dismenorreia-primaria",nome:"Dismenorreia primária",cid:"N94.4",sistema:"Geniturinário e GO",epidemiologia:"Adolescentes e mulheres jovens nulíparas (início típico 6 a 24 meses após a menarca, quando os ciclos se tornam ovulatórios),tabagismo, menarca precoce, fluxo menstrual intenso/prolongado e história familiar positiva.",exameFisico:"Palpação abdominal (dor leve suprapúbica sem defesa peritoneal) e exame pélvico/toque bimanual (em pacientes sexualmente ativas: útero móvel, de volume normal, indolor à mobilização cervical e ausência de massas anexiais ou nodulações dolorosas em fundo de saco posterior/ligamentos uterossacros, excluindo endometriose/DIP).",obrigatorios:{descricao:"Dor pélvica cíclica em cólica coincidindo com o início do fluxo menstrual, sem patologia pélvica orgânica",termos:["dismenorreia primária","menalgia","cólica menstrual cíclica","dor pélvica catamenial","cólica menstrual forte","dor no pé da barriga quando menstrua"]},comuns:{descricao:"Dor suprapúbica irradiada para região lombossacra e face anterior das coxas, duração de 48-72h, náuseas, vômitos, diarreia catamenial, cefaleia, fadiga",termos:["irradiação lombossacra","irradiação crural anterior","náuseas","êmese","diarreia catamenial","cefaleia","astenia","cólica que vai para as costas e coxas","enjoo e vômito na menstruação","intestino solta quando menstrua","dor de cabeça menstrual","Síncope vasovagal induzida pelo pico álgico"]},atipicos:{descricao:"(Alerta para Dismenorreia Secundária/Endometriose: dispareunia profunda e disquezia)",termos:["síncope álgica","lipotimia","dismenorreia secundária","disquezia catamenial","dispareunia profunda","desmaia de tanta cólica","dor para evacuar quando está menstruada"]}},{id:"sangramento-uterino-anormal-sua",nome:"Sangramento Uterino Anormal (SUA)",cid:"N93.9",sistema:"Geniturinário e GO",epidemiologia:"Extremos da vida reprodutiva (adolescentes pós-menarca por imaturidade do eixo HHO e mulheres na perimenopausa > 40 anos por anovulação),mulheres no menacme com miomatose uterina, adenomiose, pólipos, SOP, obesidade, hipotireoidismo ou coagulopatias (doença de von Willebrand),pós-menopausa (alerta para câncer de endométrio).",exameFisico:"Avaliação hemodinâmica (PA, FC, mucosas), palpação da tireoide e pesquisa de sinais de hiperandrogenismo/SOP (hirsutismo, acne, acantose), palpação abdominal, exame especular (confirmar que o sangramento provém do canal cervical e excluir lesões vaginais/cervicais ou pólipo exteriorizado) e toque vaginal bimanual (avaliar volume, contorno e consistência uterina: útero globoso/amolecido na adenomiose vs. aumentado e bocelado no leiomioma).",obrigatorios:{descricao:"Alteração na frequência, regularidade, duração ou volume do sangramento de origem corporal uterina (fora da gestação)",termos:["sangramento uterino anormal","SUA","menorragia","hipermenorreia","metrorragia","menometrorragia","polimenorreia","hemorragia menstrual","menstruação excessiva","sangramento fora do período menstrual","menstruação que não para"]},comuns:{descricao:"Fluxo > 80 mL ou duração > 7 dias, eliminação de grandes coágulos sanguíneos, troca frequente de absorventes, cólicas uterinas, sinais de anemia",termos:["eliminação de coágulos","dismenorreia associada","palidez cutâneo-mucosa","astenia","fadiga","taquicardia","saindo pedaços de sangue coagulado","vazando na roupa e na cama","trocando absorvente noturno de hora em hora","fraqueza","pálida"]},atipicos:{descricao:"Choque hipovolêmico agudo por sangramento disfuncional maciço, sangramento uterino pós-menopausa (alerta neoplásico)",termos:["instabilidade hemodinâmica","hipotensão","síncope","sangramento pós-menopausa","desmaio por perda de sangue","voltou a sangrar anos depois da menopausa"]}},{id:"ameaca-de-abortamento-abortamento",nome:"Ameaça de abortamento / Abortamento",cid:"O20.0",sistema:"Geniturinário e GO",epidemiologia:"Mulheres em idade fértil com atraso menstrual / gestantes no 1º trimestre (< 12-20 semanas),risco aumentado em idade materna avançada (> 35-40 anos), histórico de abortamentos prévios, tabagismo, uso de álcool/cocaína, diabetes descompensado, trombofilias (SAF) e infecções agudas.",exameFisico:"Sinais vitais (PA, FC, Tax para descartar infecção), palpação abdominal (excluir irritação peritoneal de gravidez ectópica rota), exame especular (quantificar o sangramento ativo, visualizar coágulos ou restos ovulares no canal cervical) e toque vaginal bimanual (avaliar o volume uterino compatível com a IG e se o Orifício Cervical Interno - OCI está fechado [ameaça/retido] ou pérvio/dilatado [inevitável/incompleto]).",obrigatorios:{descricao:"Sangramento transvaginal em gestante com idade gestacional < 20-22 semanas (Beta-hCG positivo / gestação tópica)",termos:["sangramento vaginal no primeiro trimestre","metrorragia gestacional","ameaça de abortamento","abortamento em curso","abortamento incompleto","grávida sangrando","sangue pela vagina na gravidez","perdendo o bebê"]},comuns:{descricao:"Cólicas em hipogástrio e lombar,na ameaça: sangramento discreto e colo fechado,no inevitável/incompleto: sangramento intenso, coágulos/restos ovulares e OCI pérvio",termos:["cólica uterina gestacional","dor hipogástrica","dor lombar","orifício cervical interno fechado","orifício cervical pérvio","eliminação de restos ovulares","cólica de menstruação estando grávida","borra de café na calcinha","sangramento vivo com coágulos","colo do útero aberto"]},atipicos:{descricao:"Abortamento infectado/séptico (febre, calafrios, secreção fétida/purulenta, dor severa à mobilização uterina), choque vagal/hipovolêmico",termos:["abortamento séptico","abortamento infectado","endomiometrite","pirexia","calafrios","corrimento vaginal fétido","secreção purulenta cervical","choque hipovolêmico","choque neurogênico","febre alta e corrimento fedido após sangramento na gravidez"]}},{id:"hiperemese-gravidica",nome:"Hiperêmese gravídica",cid:"O21.0",sistema:"Geniturinário e GO",epidemiologia:"Gestantes no 1º trimestre (início entre 5-6 semanas, pico em 9 semanas),maior incidência em primigestas, gestação múltipla (gemelar), doença trofoblástica gestacional (mola hidatiforme - altos níveis de Beta-hCG), feto do sexo feminino e histórico pessoal/familiar de hiperêmese.",exameFisico:"Pesagem da paciente (comparar com peso pré-gestacional para documentar perda > 5%), avaliação de sinais de desidratação (turgor cutâneo, mucosas, PA e FC em decúbito e ortostatismo), palpação da altura uterina (útero maior que o esperado para a IG sugere mola ou gemelaridade), palpação da tireoide e exame neurológico/ocular (pesquisar nistagmo e ataxia da Encefalopatia de Wernicke).",obrigatorios:{descricao:"Vômitos incoercíveis na gestação levando à perda ponderal (> 5% do peso pré-gestacional), desidratação e cetonúria",termos:["hiperêmese gravídica","êmese incoercível gestacional","perda ponderal na gestação","cetonúria","desidratação","grávida vomitando tudo","não para nada no estômago","emagreceu na gravidez"]},comuns:{descricao:"Náuseas contínuas incapacitantes, sialorreia (ptialismo), intolerância hídrica e alimentar, hipotensão postural, taquicardia, mucosas secas, hipocalemia",termos:["náuseas severas","sialorreia","ptialismo","intolerância oral absoluta","hipotensão ortostática","taquicardia","turgor diminuído","astenia","enjoo o dia inteiro","vomitando até água","cuspindo muita saliva","tontura ao levantar","muito fraca"]},atipicos:{descricao:"Encefalopatia de Wernicke (confusão, ataxia e nistagmo/oftalmoplegia), hematêmese por síndrome de Mallory-Weiss, icterícia",termos:["encefalopatia de Wernicke","confusão mental","ataxia","nistagmo","oftalmoplegia","síndrome de Mallory-Weiss","hematêmese","icterícia","grávida confusa","tonta e com visão dupla","vomitou sangue depois de fazer muita força para vomitar"]}},{id:"injuria-renal-aguda-ira",nome:"Injúria Renal Aguda (IRA)",cid:"N17.9",sistema:"Geniturinário e GO",epidemiologia:"Idosos, pacientes hospitalizados ou sépticos, portadores de doença renal crônica prévia, IC, cirrose hepática, diabéticos,exposição recente a nefrotóxicos (AINEs, contraste iodado, aminoglicosídeos, vancomicina), quadros de desidratação grave (diarreia/vômitos) ou obstrução urinária baixa (HPB, neoplasia pélvica).",exameFisico:"Avaliação do status volêmico (diferenciar hipovolemia pré-renal [mucosas secas, hipotensão postural] de hipervolemia [edema de MMII, anasarca, turgência jugular, estertores pulmonares]), ausculta cardíaca (pesquisar atrito pericárdico urêmico), pesquisa de flapping (encefalopatia urêmica) e palpação/percussão suprapúbica (excluir globo vesical / IRA pós-renal obstrutiva).",obrigatorios:{descricao:"Redução abrupta do débito urinário (oligúria < 0,5 mL/kg/h ou anúria) e/ou elevação aguda de escórias nitrogenadas (creatinina/ureia)",termos:["oligúria","anúria","elevação de creatinina","azotemia aguda","injúria renal aguda","insuficiência renal aguda","parou de urinar","diminuiu muito a quantidade de xixi","rim parou de funcionar"]},comuns:{descricao:"Edema periférico (MMII) e periorbitário, ganho ponderal hídrico rápido, hipertensão arterial, astenia, inapetência, náuseas",termos:["edema de membros inferiores","edema periorbitário","anasarca","hipervolemia","hipertensão arterial secundária","astenia","hiporexia","náuseas","rosto e olhos inchados","pernas muito inchadas","pressão subiu","enjoo e falta de apetite"]},atipicos:{descricao:"Atrito pericárdico e dor torácica, encefalopatia urêmica (flapping, confusão, convulsão), soluços persistentes, edema agudo de pulmão, arritmias por hipercalemia",termos:["síndrome urêmica","uremia","pericardite urêmica","encefalopatia urêmica","flapping","asterixis","crise convulsiva","singulto persistente","dispneia","hipercalemia","hálito urêmico","confusão mental","mãos tremendo","soluço que não passa","falta de ar"]}},{id:"lombalgia-mecanica-aguda",nome:"Lombalgia mecânica aguda",cid:"M54.5",sistema:"Musculoesquelético",epidemiologia:"Adultos em idade produtiva (30 a 55 anos),trabalhadores braçais (carga e descarga, construção civil), motoristas profissionais, sedentários, obesos, tabagistas, má postura ergonômica ou esforço físico inhabitual recente.",exameFisico:"Inspeção do alinhamento vertebral e marcha, avaliação da amplitude de flexo-extensão lombar, palpação da musculatura paravertebral (contratura/pontos-gatilho) e dos processos espinhosos (dor óssea pontual sugere fratura ou espondilodiscite), Manobra de Lasègue (obrigatoriamente negativa), exame neurológico de MMII (força, reflexos e sensibilidade normais) e Manobra de Giordano (excluir dor renal).",obrigatorios:{descricao:"Dor lombar baixa de caráter mecânico (piora com movimento/carga e alivia com repouso), sem irradiação radicular abaixo do joelho",termos:["lombalgia mecânica","dor lombar aguda","lumbago","dor paravertebral lombar","dor nas costas","dor na coluna lombar","dor nos quartos","travou a coluna","mau jeito nas costas"]},comuns:{descricao:"Contratura/espasmo da musculatura paravertebral, limitação da flexo-extensão do tronco, postura antálgica, início após esforço físico, exame neurológico normal",termos:["contratura paravertebral","espasmo muscular lombar","limitação da amplitude de movimento","escoliose antálgica","dor à palpação paravertebral","músculo das costas duro e contraído","não consegue esticar o corpo","andando torto de dor","doeu depois de pegar peso"]},atipicos:{descricao:"Dor noturna que não alivia em decúbito, febre/calafrios, perda ponderal inexplicada, história de câncer, trauma em idosos (Red Flags)",termos:["dor lombar inflamatória/noturna","pirexia","perda ponderal involuntária","espondilodiscite","fratura vertebral patológica","dor nas costas que piora deitado à noite","dor na coluna com febre e emagrecimento"]}},{id:"lombociatalgia-radiculopatia-compressiva",nome:"Lombociatalgia / Radiculopatia compressiva",cid:"M54.4",sistema:"Musculoesquelético",epidemiologia:"Adultos de 30 a 50 anos (pico para hérnia de disco núcleo pulposo L4-L5 e L5-S1) e idosos > 60 anos (estenose de canal lombar degenerativa),trabalhadores que carregam peso em flexão/rotação do tronco, obesos, tabagistas e motoristas.",exameFisico:'Teste de Lasègue (elevação da perna estendida em decúbito dorsal desencadeando dor radicular entre 30° e 70°) e Sinal de Bragard (dorsiflexão passiva do pé no ângulo de Lasègue agrava a dor), avaliação da marcha nos calcanhares (testa raiz L4/L5 - tibial anterior) e na ponta dos pés (testa raiz S1 - gastrocnêmio/sóleo), pesquisa de reflexos patelar (L4) e aquileu (S1), sensibilidade nos dermátomos e avaliação da sensibilidade perineal ("em sela") se queixa esfincteriana.',obrigatorios:{descricao:"Dor lombar irradiada para membro inferior respeitando território dermatomérico (L4, L5 ou S1), estendendo-se abaixo do joelho",termos:["lombociatalgia","ciatalgia","dor radicular","radiculopatia lombar","compressão radicular","hérnia de disco lombar","dor no nervo ciático","dor nas costas que desce pela perna até o pé","ciático inflamado"]},comuns:{descricao:"Dor em queimação/choque elétrico, parestesias no pé/perna, piora com manobra de Valsalva (tosse/espirro), Sinal de Lasègue positivo, hiporreflexia aquileia ou patelar",termos:["dor neuropática","parestesia em dermátomo","hipoestesia","sinal de Lasègue positivo","teste de elevação da perna retificada positivo","agravamento à manobra de Valsalva","hiporreflexia aquileia","dor em choque na perna","formigamento na perna e nos dedos do pé","perna dormente","dói na perna quando tosse ou espirra"]},atipicos:{descricao:"Anestesia em sela (perineal), retenção urinária ou incontinência fecal/urinária, pé caído agudo (Síndrome da Cauda Equina)",termos:["síndrome da cauda equina","anestesia em sela","hipoestesia perineal","retenção urinária neurogênica","incontinência fecal","hipotonia esfincteriana","paresia de dorsiflexão plantar","pé caído","dormência no meio das pernas e nádegas","não sente quando limpa o ânus","não consegue levantar a ponta do pé","pé arrastando"]}},{id:"cervicalgia-aguda-torcicolo",nome:"Cervicalgia aguda / Torcicolo",cid:"M54.2",sistema:"Musculoesquelético",epidemiologia:'Adolescentes e adultos de todas as idades,trabalhadores de escritório/uso prolongado de computador e smartphone ("text neck"), tensão emocional/ansiedade, postura inadequada durante o sono, movimentos bruscos do pescoço ou espondilose cervical em idosos.',exameFisico:"Inspeção postural da cabeça e pescoço, avaliação da amplitude de movimento ativo e passivo (flexão, extensão, inclinação lateral e rotação), palpação do trapézio, esternocleidomastoideo e processos espinhosos, Manobra de Spurling (inclinação lateral e compressão axial da cabeça para pesquisar radiculopatia cervical), exame neurológico de MMSS e pesquisa de rigidez de nuca / sinais de Brudzinski e Kernig (se houver febre ou cefaleia aguda).",obrigatorios:{descricao:"Dor na região cervical posterior/lateral associada a limitação dolorosa da rotação/inclinação da cabeça",termos:["cervicalgia aguda","torcicolo espasmódico","dor cervical mecânica","limitação da mobilidade cervical","dor no pescoço","pescoço travado","torcicolo","não consegue virar o pescoço"]},comuns:{descricao:"Espasmo do esternocleidomastoideo e trapézio, postura antálgica da cabeça, dor à palpação muscular/espinhosa, cefaleia cervicogênica occipital",termos:["espasmo de trapézio","contratura de esternocleidomastoideo","atitude antálgica cefálica","cefaleia cervicogênica","pontos-gatilho miofasciais","pescoço duro","ombro e nuca tensos","cabeça inclinada para o lado","dor que sobe da nuca para a cabeça"]},atipicos:{descricao:"Cerviobraquialgia com parestesias em mãos e Sinal de Spurling positivo (radiculopatia), sinais de mielopatia (Babinski +), rigidez de nuca com febre (meningite)",termos:["cervicobraquialgia","radiculopatia cervical","sinal de Spurling positivo","parestesia em membros superiores","mielopatia cervical","rigidez de nuca","sinal de Brudzinski","dor no pescoço que corre para o braço e formiga a mão","nuca dura com febre"]}},{id:"osteoartrite-artrose",nome:"Osteoartrite (Artrose)",cid:"M19.9",sistema:"Musculoesquelético",epidemiologia:"Adultos > 50 anos e idosos (prevalência universal acima dos 70 anos), predomínio no sexo feminino (especialmente mãos e joelhos pós-menopausa),obesidade (principal fator modificável para gonartrose), histórico de trauma articular/fratura ou lesão meniscal/ligamentar prévia, sobrecarga ocupacional e história familiar.",exameFisico:"Inspeção articular (alinhamento em geno varo/valgo, nódulos de Heberden nas interfalangianas distais e nódulos de Bouchard nas proximais, rizartrose do polegar), palpação da interlinha articular à mobilização passiva (percepção de crepitação óssea/cartilaginosa grosseira), avaliação da amplitude de movimento (bloqueio de extensão/flexão ou rotação interna do quadril) e Sinal da Tecla da Patela (se houver derrame articular).",obrigatorios:{descricao:"Dor articular de padrão mecânico (protocinética – piora no início do movimento e carga, melhora com repouso) e rigidez matinal fugaz (< 30 min)",termos:["artralgia mecânica","dor protocinética","rigidez matinal breve","osteoartrite","osteoartrose","gonartrose","coxartrose","espondiloartrose","artrose","desgaste na junta","dor no joelho ao começar a andar","junta dura de manhã por poucos minutos"]},comuns:{descricao:"Crepitação articular à mobilização, alargamento ósseo (nódulos de Heberden e Bouchard), limitação da amplitude de movimento, ausência de sintomas sistêmicos",termos:["crepitação articular","nódulos de Heberden","nódulos de Bouchard","deformidade óssea articular","redução da amplitude de movimento","geno varo","joelho estalando","barulho de areia na junta","ossos dos dedos das mãos grossos e tortos","dificuldade para dobrar o joelho"]},atipicos:{descricao:"Derrame articular agudo com calor discreto (artrose ativada ou pseudogota), bloqueio articular mecânico por corpo livre",termos:["derrame articular","hidrartrose","sinovite reacional","bloqueio articular mecânico","corpo livre intra-articular","água no joelho","joelho inchou","joelho trava no meio do movimento"]}},{id:"tendinopatias-e-bursites-do-ombro",nome:"Tendinopatias e Bursites do ombro",cid:"M75.1",sistema:"Musculoesquelético",epidemiologia:'Adultos > 40 anos e idosos,trabalhadores e atletas que realizam movimentos repetitivos de elevação do braço acima do nível da cabeça (pintores, pedreiros, professores, estoquistas, nadadores, tenistas), diabéticos e hipotireoideos (forte associação com capsulite adesiva / "ombro congelado").',exameFisico:"Inspeção de trofismo das fossas supra e infraespinal, pesquisa do Arco Doloroso (abdução ativa entre 60° e 120°), manobras de impacto subacromial (Teste de Neer e Teste de Hawkins-Kennedy), testes específicos dos tendões do manguito rotador (Teste de Jobe para supraespinal, Teste de Patte para infraespinal, Teste de Gerber / Lift-off para subescapular), Teste de Yergason/Speed (cabeça longa do bíceps) e Teste da Queda do Braço (ruptura completa).",obrigatorios:{descricao:"Dor no ombro (região deltoidea anterolateral) desencadeada ou agravada pela elevação/abdução ativa do membro superior",termos:["ombro doloroso","síndrome do impacto subacromial","tendinopatia do manguito rotador","tendinite do supraespinal","bursite subacromial-subdeltoidea","dor no ombro","bursite no ombro","tendinite no ombro","dor para levantar o braço"]},comuns:{descricao:"Arco doloroso positivo (60°-120°), piora noturna ao deitar sobre o ombro, testes de Neer, Hawkins-Kennedy e Jobe positivos, dificuldade para pentear o cabelo",termos:["arco doloroso positivo","dor noturna em decúbito lateral","teste de Neer positivo","teste de Hawkins-Kennedy positivo","teste de Jobe positivo","teste de Patte","teste de Gerber","dor no ombro à noite na cama","não consegue dormir em cima do lado afetado","dor para estender roupa no varal","dor para colocar a mão nas costas"]},atipicos:{descricao:"Pseudoparalisia aguda com teste da queda do braço positivo (ruptura maciça do manguito), dor hiperaguda excruciante (tendinite calcária), capsulite adesiva",termos:["teste da queda do braço positivo","ruptura completa do manguito rotador","tendinite calcária aguda","capsulite adesiva","ombro congelado","perda da rotação externa passiva","braço cai sozinho sem força","ombro totalmente travado e duro"]}},{id:"fascite-plantar",nome:"Fascite plantar",cid:"M72.2",sistema:"Musculoesquelético",epidemiologia:"Adultos de 40 a 60 anos,obesos e sobrepeso, corredores de longa distância, militares, profissionais que trabalham em pé sobre superfícies rígidas por longas horas, portadores de pé plano (pronado) ou pé cavo, encurtamento do tendão calcâneo (Aquiles) e uso de calçados sem suporte plantar (rasteirinhas/chinelos).",exameFisico:"Palpação digital firme da tuberosidade anteromedial do calcâneo (ponto de máxima dor na inserção da fáscia plantar), realização do Teste de Windlass (dorsiflexão passiva forçada da primeira articulação metatarsofalângica/hálux tensionando a aponeurose plantar e reproduzindo a dor no calcanhar) e avaliação da dorsiflexão do tornozelo.",obrigatorios:{descricao:"Dor localizada na região plantar medial do retropé (tuberosidade medial do calcâneo)",termos:["talalgia plantar","fascite plantar","dor na inserção da fáscia plantar","esporão de calcâneo","dor na sola do pé","dor no calcanhar","dor de esporão"]},comuns:{descricao:"Dor intensa nos primeiros passos pela manhã ou após períodos sentado (dor pós-estática) que alivia parcialmente ao caminhar, Teste de Windlass positivo",termos:["dor pós-estática","dor matinal aos primeiros passos","teste de Windlass positivo","dor à dorsiflexão passiva do hálux","dor à palpação da tuberosidade medial do calcâneo","pisada em agulha ao sair da cama de manhã","dor forte quando pisa no chão pela primeira vez","melhora depois que o pé esquenta andando"]},atipicos:{descricao:"Dor em queimação e parestesia plantar (aprisionamento do nervo de Baxter), estalo súbito com perda do arco plantar (ruptura aguda da fáscia)",termos:["neuropatia de Baxter","parestesia plantar","ruptura da fáscia plantar","queimação no calcanhar","sola do pé formigando"]}},{id:"artrite-gotosa-aguda-gota",nome:"Artrite gotosa aguda (Gota)",cid:"M10.9",sistema:"Musculoesquelético",epidemiologia:"Homens > 30-40 anos (90% dos casos clássicos) e mulheres apenas após a menopausa,portadores de síndrome metabólica, obesidade, HAS, doença renal crônica, usuários de diuréticos tiazídicos (hidroclorotiazida) ou de alça (furosemida), consumidores de cerveja/destilados, carne vermelha, frutos do mar e refrigerantes ricos em frutose.",exameFisico:"Inspeção articular (edema acentuado, pele tensa, brilhante e eritema violáceo na 1ª metatarsofalângica – podagra – ou tornozelo/joelho), palpação superficial (calor local intenso e alodínia extrema ao menor toque), inspeção de pavilhão auricular, olécrano e tendão de Aquiles em busca de tofos gotosos e aferição de temperatura/sinais vitais (diferenciar de artrite séptica).",obrigatorios:{descricao:"Monoartrite (ou oligoartrite) inflamatória de início hiperagudo, atingindo pico álgico máximo em 12 a 24 horas",termos:["monoartrite aguda","artrite microcristalina","crise de gota","início hiperagudo","junta inchou e doeu muito da noite para o dia","crise de ácido úrico"]},comuns:{descricao:"Podagra (1ª metatarsofalângica), dor lancinante com alodínia extrema (intolerância ao lençol), edema, eritema violáceo brilhante, calor local intenso, tofos gotosos",termos:["podagra","artrite da primeira metatarsofalângica","alodínia intensa","hiperalgesia","eritema violáceo periarticular","calor articular","edema articular","tofos gotosos","descamação pós-inflamatória","dedão do pé inchado","roxo e pegando fogo","não aguenta nem o peso do lençol em cima do pé","dor insuportável no dedão do pé"]},atipicos:{descricao:"Poliartrite aguda febril (idosos/mulheres em uso de tiazídicos), bursite olecraniana ou pré-patelar gotosa aguda",termos:["poliartrite gotosa","pirexia","bursite olecraniana gotosa","várias juntas inchadas com febre","bola inchada e vermelha na ponta do cotovelo"]}},{id:"fibromialgia",nome:"Fibromialgia",cid:"M79.7",sistema:"Musculoesquelético",epidemiologia:"Mulheres (80 a 90% dos casos) entre 30 e 55 anos,forte associação com transtorno depressivo, ansiedade generalizada, estresse pós-traumático, distúrbios do sono, síndrome do intestino irritável, cefaleia crônica, sedentarismo e história familiar de dor crônica.",exameFisico:"Palpação digital de grupos mus
