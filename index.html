ra, perda transitória da consciência (< 30 min), amnésia lacunar/retrógrada para o evento, confusão momentânea, náuseas ou vômito isolado, hematoma subgaleal ("galo")',termos:["cefaleia pós-traumática","perda transitória da consciência","amnésia pós-traumática","amnésia retrógrada","confusão mental transitória","tontura","náuseas","hematoma subgaleal","bossas serossanguinolentas","desmaiou por alguns segundos quando bateu a cabeça","não lembra como foi o acidente","ficou meio tonto perguntando a mesma coisa","subiu um galo na cabeça"]},atipicos:{descricao:"Queda do Glasgow, >= 2 episódios de vômitos em jato, cefaleia progressiva grave, convulsão pós-traumática, déficit focal, anisocoria, sinais de fratura de base de crânio (Guaxinim, Battle, otoliquorreia/rinoliquorreia)",termos:["vômitos em jato repetidos","rebaixamento do nível de consciência","intervalo lúcido","anisocoria","crise convulsiva pós-traumática","déficit neurológico focal","sinal do Guaxinim","equimose periorbitária bilateral","sinal de Battle","equimose retroauricular","hemotímpano","otoliquorreia","rinoliquorreia","bateu a cabeça e começou a vomitar várias vezes","ficou muito sonolento depois da pancada","uma menina do olho ficou maior que a outra","saindo sangue ou água clara pelo ouvido/nariz"]}},{id:"fraturas-fechadas-de-extremidades",nome:"Fraturas fechadas de extremidades",cid:"T14.2",sistema:"Traumatologia",epidemiologia:"Distribuição bimodal: crianças e jovens (quedas sobre a mão espalmada – fratura de rádio distal/clavícula/escafoide – e traumas esportivos/motociclísticos de alta energia) e idosos / mulheres pós-menopausa com osteoporose (fraturas por fragilidade após queda da própria altura: colo do fêmur/transtrocantérica, rádio distal [Colles] e úmero proximal).",exameFisico:"Inspeção da extremidade (deformidade angular/rotacional, encurtamento e rotação externa do membro inferior nas fraturas de fêmur proximal, edema e integridade da pele para descartar fratura exposta), palpação óssea delicada (incluindo a tabaqueira anatômica em traumas de punho), avaliação neurovascular distal obrigatória (pulsos distais, perfusão capilar, sensibilidade e motricidade dos nervos radial, mediano, ulnar, fibular e tibial) e palpação da tensão dos compartimentos musculares com estiramento passivo dos dedos (excluir Síndrome Compartimental Aguda).",obrigatorios:{descricao:"Perda da continuidade cortical óssea pós-traumática com integridade do envelope cutâneo sobre o foco de fratura (sem exposição óssea externa)",termos:["fratura óssea fechada","solução de continuidade óssea","trauma ortopédico contuso","osso quebrado","quebrou o braço/perna/punho","trincou o osso"]},comuns:{descricao:"Dor óssea aguda intensa no foco fraturário, incapacidade funcional imediata, edema acentuado, equimose/hematoma, deformidade anatômica visível (angulação/encurtamento), crepitação óssea e mobilidade anormal",termos:["dor óssea localizada intensa","impotência funcional imediata","deformidade anatômica angular","deformidade em dorso de garfo","encurtamento e rotação externa de membro","edema traumático","equimose","crepitação óssea","caiu","ouviu um estalo e o braço ficou torto","não consegue mexer o braço/perna de tanta dor","inchou muito na hora"]},atipicos:{descricao:"Dor isolada na tabaqueira anatômica (fratura oculta de escafoide), Síndrome Compartimental Aguda (dor desproporcional ao estiramento passivo, parestesia, palidez, tensão muscular em pedra), lesão neurovascular (mão caída)",termos:["dor na tabaqueira anatômica","fratura de escafoide","síndrome compartimental aguda","dor severa ao estiramento passivo dos dedos","parestesia distal","palidez e ausência de pulso distal","neuropraxia do nervo radial","dor insuportável na perna/braço quebrado que não passa com remédio e dedos dormentes"]}},{id:"queimaduras-termicas-ou-quimicas",nome:"Queimaduras térmicas ou químicas",cid:"T30.0",sistema:"Traumatologia",epidemiologia:"Crianças < 5 anos (principalmente escaldaduras domésticas na cozinha puxando cabos de panelas com água/café/óleo fervente,atenção a padrões de imersão em luva/meia simétricos que sugerem maus-tratos infantis), adultos jovens e trabalhadores industriais/construção civil (chama direta, álcool líquido em churrasqueiras, explosão de gás, produtos químicos cáusticos e queimaduras elétricas) e epilépticos/idosos.",exameFisico:"Exame primário da via aérea (inspecionar face, vibrissas nasais chamuscadas, fuligem na cavidade oral/orofaringe, rouquidão e estridor laríngeo em vítimas de incêndio em local fechado), cálculo da Superfície Corporal Queimada (SCQ) pela Regra dos Nove de Wallace (ou tabela de Lund-Browder em crianças, contabilizando apenas 2º e 3º graus), avaliação da profundidade (retorno capilar e sensibilidade dolorosa presentes no 2º grau vs. placa coriácea indolor no 3º grau) e avaliação de perfusão distal em queimaduras circunferenciais de membros ou tórax.",obrigatorios:{descricao:"Lesão tecidual cutânea aguda por transferência térmica (escaldadura, chama, contato) ou exposição a agente químico cáustico",termos:["queimadura térmica","escaldadura","queimadura por chama direta","queimadura química","queimadura de primeiro grau","queimadura de segundo grau","queimou a pele","queimadura com água fervendo/óleo quente/fogo"]},comuns:{descricao:"1º Grau: eritema, calor e dor/ardor intenso sem bolhas. 2º Grau: flictenas (bolhas) íntegras ou rotas, derme rósea/úmida extremamente dolorosa, exsudação plasmática",termos:["eritema térmico","hiperalgesia cutânea","flictenas","bolhas epidérmicas","desepitelização","exsudação serosa","dor urente intensa","pele muito vermelha e ardendo","levantou bolhas de água na queimadura","pele soltou e ficou em carne viva doendo muito"]},atipicos:{descricao:"3º Grau: placa esbranquiçada/nacarada, marrom ou carbonizada, coriácea (couro) e indolor à punção,Lesão Inalatória (vibrissas chamuscadas, fuligem em orofaringe, escarro carbonáceo, rouquidão e estridor)",termos:["queimadura de terceiro grau","queimadura de espessura total","escara coriácea indolor","anestesia térmica local","lesão inalatória de vias aéreas","vibrissas nasais chamuscadas","escarro carbonáceo","fuligem em orofaringe","disfonia e estridor pós-queimadura","pele queimada ficou branca ou preta","dura e não sente dor quando toca","inalou fumaça preta no incêndio e ficou rouco com falta de ar"]}},{id:"corpo-estranho-em-orificios-naturais",nome:"Corpo estranho em orifícios naturais",cid:"T15.0 / T16",sistema:"Traumatologia",epidemiologia:"Crianças de 1 a 5 anos e pacientes com deficiência intelectual/transtornos psiquiátricos (introdução de grãos de feijão/milho, miçangas, peças de brinquedos, espuma ou baterias em botão no nariz e ouvido),trabalhadores metalúrgicos/serralheiros/construção civil sem EPI (fagulhas metálicas e limalha de ferro de esmeril/lixadeira na córnea),adultos e crianças durante refeições com peixe ou aves (espinha/osso na orofaringe).",exameFisico:"Ocular: instilação de colírio anestésico, inspeção direta da córnea, eversão obrigatória da pálpebra superior (local onde corpos estranhos tarsais se alojam e arranham a córnea verticalmente), teste com fluoresceína e pesquisa do Sinal de Seidel (extravasamento de humor aquoso se suspeita de perfuração). Otológico e Nasal: otoscopia e rinoscopia anterior sob contenção segura (sempre verificar a narina e o ouvido contralaterais também). Faríngeo: oroscopia com abaixador de língua e foco de luz inspecionando criptas amigdalianas, base da língua e valéculas.",obrigatorios:{descricao:"Retenção de objeto ou material exógeno na córnea/conjuntiva, conduto auditivo externo, cavidade nasal ou faringe/esôfago",termos:["corpo estranho corneano","corpo estranho conjuntival","corpo estranho em conduto auditivo externo","corpo estranho nasal","corpo estranho em orofaringe","impactação alimentar esofágica","cisco no olho","fagulha no olho","objeto/inseto dentro do ouvido","criança colocou coisa no nariz","espinha de peixe na garganta"]},comuns:{descricao:"Ocular: dor/arranhadura ao piscar, lacrimejamento, blefaroespasmo, fotofobia, hiperemia. Otológico: plenitude auricular, hipoacusia, otalgia ou ruído de inseto vivo. Faríngeo: odinofagia em pontada localizada ao engolir",termos:["sensação de corpo estranho ocular","blefaroespasmo","epífora","fotofobia","abrasão corneana Fluoresceína positiva","plenitude auricular","otalgia","odinofagia em pontada localizada","sialorreia","olho lacrimejando e arranhando cada vez que pisca","entrou um bicho no ouvido e está mexendo/fazendo barulho","espinha de peixe ou osso preso furando a garganta ao engolir"]},atipicos:{descricao:"Rinorreia purulenta e fétida estritamente unilateral em crianças (corpo estranho nasal esquecido), necrose/perfuração rápida por bateria em botão, perfuração ocular com pupila em gota (Seidel +)",termos:["rinorreia fétida unilateral","corpo estranho nasal crônico","ingestão/inserção de bateria em botão","necrose liquefativa mucosa","sinal de Seidel positivo","discória/pupila em gota","anel de ferrugem corneano","criança saindo pus com cheiro podre de um lado só do nariz","engoliu ou colocou pilha redonda no nariz/ouvido"]}}],ev=[{id:"tuberculose-pulmonar",nome:"Tuberculose pulmonar",cid:"A15.3",sistema:"Respiratório e ORL",epidemiologia:"Agravo de notificação compulsória com alta carga no Brasil. Risco maior em pessoas em situação de rua, privadas de liberdade, vivendo com HIV, etilistas, tabagistas, desnutridos, diabéticos, profissionais de saúde e contactantes domiciliares de caso bacilífero.",exameFisico:"Ausculta pulmonar (estertores em ápices), percussão, avaliação de linfonodos cervicais e supraclaviculares, aferição de peso e cálculo de IMC, inspeção de mucosas e pesquisa de sinais de imunossupressão.",obrigatorios:{descricao:"Tosse por três semanas ou mais, com ou sem expectoração, em paciente com fator de risco.",termos:["tosse crônica","tosse por mais de três semanas","tosse arrastada","tosse persistente","expectoração crônica","escarro purulento crônico","tosse que não passa","tosse há meses","tossindo há muito tempo","catarro todo dia de manhã"]},comuns:{descricao:"Febre vespertina, sudorese noturna, perda ponderal, astenia e inapetência.",termos:["febre vespertina","sudorese noturna","suor noturno","perda ponderal","emagrecimento","astenia","inapetência","hiporexia","dor torácica pleurítica","suando muito à noite","febre no fim da tarde","perdendo peso sem querer","sem vontade de comer","fraqueza o dia todo"]},atipicos:{descricao:"Hemoptise, derrame pleural, formas extrapulmonares e tuberculose miliar.",termos:["hemoptise","hemoptoicos","escarro com sangue","tuberculose miliar","tuberculose ganglionar","tuberculose pleural","escrófula","linfonodomegalia cervical fria","tossindo sangue","íngua no pescoço que não some"]}},{id:"rinossinusite-cronica",nome:"Rinossinusite crônica",cid:"J32.9",sistema:"Respiratório e ORL",epidemiologia:"Adultos com rinite alérgica, desvio de septo, polipose nasal, tabagismo, refluxo laringofaríngeo ou exposição ocupacional a poeira e produtos químicos. Sintomas por mais de doze semanas.",exameFisico:"Rinoscopia anterior (secreção em meato médio, pólipos, desvio septal), oroscopia com pesquisa de gotejamento pós-nasal, palpação e percussão de seios da face.",obrigatorios:{descricao:"Obstrução nasal e rinorreia por mais de doze semanas, com dor ou pressão facial.",termos:["obstrução nasal crônica","rinorreia crônica","gotejamento pós-nasal","descarga retronasal","pressão facial","dor facial crônica","nariz entupido há meses","catarro descendo na garganta","peso no rosto","nariz sempre trancado"]},comuns:{descricao:"Hiposmia, cefaleia frontal, tosse crônica e halitose.",termos:["hiposmia","anosmia","cefaleia frontal","tosse noturna crônica","halitose","plenitude auricular","pigarro constante","perda de olfato","sem sentir cheiro","dor na testa","mau hálito","pigarreando o tempo todo"]},atipicos:{descricao:"Polipose nasal, complicação orbitária e agudização bacteriana.",termos:["polipose nasal","pólipos nasais","edema periorbitário","celulite pré-septal","febre com piora súbita","rinorreia purulenta franca","carne crescendo no nariz","olho inchado","piorou de repente com febre"]}},{id:"apneia-obstrutiva-do-sono",nome:"Apneia obstrutiva do sono",cid:"G47.3",sistema:"Respiratório e ORL",epidemiologia:"Homens de meia-idade, obesos, com circunferência cervical aumentada, hipertensos resistentes, portadores de fibrilação atrial, retrognatia, hipertrofia amigdaliana ou uso de álcool e sedativos à noite.",exameFisico:"Medida da circunferência cervical, cálculo do IMC, oroscopia com classificação de Mallampati, avaliação de retrognatia, aferição da pressão arterial e aplicação de questionário STOP-Bang ou Epworth.",obrigatorios:{descricao:"Ronco habitual com pausas respiratórias testemunhadas e sonolência diurna.",termos:["ronco habitual","apneia testemunhada","pausas respiratórias no sono","sonolência diurna excessiva","ronco alto","para de respirar dormindo","ronca muito","dorme o dia todo","cochila no trabalho"]},comuns:{descricao:"Sono não reparador, cefaleia matinal, nictúria e irritabilidade.",termos:["sono não reparador","cefaleia matinal","nictúria","despertares noturnos","boca seca ao acordar","irritabilidade","déficit de atenção","acorda cansado","dor de cabeça ao acordar","levanta para urinar à noite","acorda engasgando","memória ruim"]},atipicos:{descricao:"Hipertensão resistente, arritmias noturnas e cor pulmonale.",termos:["hipertensão resistente","fibrilação atrial noturna","hipoxemia noturna","policitemia","cor pulmonale","disfunção erétil","pressão que não baixa com remédio","coração disparando de madrugada"]}},{id:"derrame-pleural",nome:"Derrame pleural",cid:"J90",sistema:"Respiratório e ORL",epidemiologia:"Secundário a insuficiência cardíaca, pneumonia, tuberculose, neoplasia, embolia pulmonar, cirrose com ascite ou doença renal crônica. Mais frequente em idosos e em pacientes oncológicos.",exameFisico:"Percussão torácica (macicez em base), frêmito toracovocal reduzido, ausculta com murmúrio abolido, pesquisa de egofonia no limite superior e avaliação da expansibilidade.",obrigatorios:{descricao:"Dispneia com macicez à percussão e murmúrio vesicular abolido em base pulmonar.",termos:["macicez em base pulmonar","murmúrio vesicular abolido","frêmito toracovocal diminuído","dispneia progressiva","expansibilidade reduzida","som maciço na base","água no pulmão","falta de ar que piora deitado","não entra ar de um lado"]},comuns:{descricao:"Dor torácica pleurítica, tosse seca e redução da expansibilidade.",termos:["dor pleurítica","dor ventilatório-dependente","tosse seca","taquipneia","ortopneia","egofonia","dor ao respirar fundo","pontada no peito ao puxar o ar","cansaço aos esforços","respiração curta"]},atipicos:{descricao:"Empiema, derrame neoplásico volumoso e hidropneumotórax.",termos:["empiema pleural","derrame neoplásico","febre alta com toxemia","desvio de traqueia","hidropneumotórax","derrame volumoso","pus no pulmão","traqueia torta para o lado"]}},{id:"pneumotorax-espontaneo",nome:"Pneumotórax espontâneo",cid:"J93.0",sistema:"Respiratório e ORL",epidemiologia:"Homens jovens, altos e magros, tabagistas, no primário; portadores de DPOC, asma grave, tuberculose prévia ou fibrose pulmonar, no secundário. Pode seguir-se a esforço ou tosse intensa.",exameFisico:"Inspeção da expansibilidade, percussão (hipertimpanismo), ausculta (murmúrio abolido), palpação de enfisema subcutâneo, verificação da posição da traqueia e aferição de pressão e saturação.",obrigatorios:{descricao:"Dor torácica súbita com dispneia, hipertimpanismo e murmúrio vesicular abolido unilateral.",termos:["dor torácica súbita","hipertimpanismo torácico","murmúrio vesicular abolido unilateral","dispneia súbita","timpanismo à percussão","dor no peito do nada","falta de ar repentina","pulmão não enche de um lado"]},comuns:{descricao:"Taquipneia, taquicardia, tosse seca e ansiedade.",termos:["taquipneia","taquicardia","tosse seca irritativa","dor pleurítica","enfisema subcutâneo","respiração curta e rápida","coração acelerado","estalo embaixo da pele","dor que piora ao respirar"]},atipicos:{descricao:"Pneumotórax hipertensivo com instabilidade hemodinâmica.",termos:["pneumotórax hipertensivo","desvio contralateral de traqueia","turgência jugular","hipotensão arterial","cianose","parada cardiorrespiratória iminente","traqueia empurrada para o lado","ficou roxo e com pressão baixa"]}},{id:"coqueluche",nome:"Coqueluche",cid:"A37.9",sistema:"Respiratório e ORL",epidemiologia:"Agravo de notificação compulsória. Lactentes menores de seis meses com vacinação incompleta correm maior risco de forma grave. Adolescentes e adultos com imunidade vacinal decaída são a principal fonte de contágio domiciliar.",exameFisico:"Ausculta pulmonar, observação de um episódio de tosse, pesquisa de hemorragia subconjuntival e petéquias em face, avaliação de saturação e, em lactentes, de tiragem e apneia.",obrigatorios:{descricao:"Tosse paroxística em acessos, seguida de guincho inspiratório ou vômito pós-tosse.",termos:["tosse paroxística","tosse em acessos","guincho inspiratório","vômito pós-tosse","tosse comprida","acesso de tosse sem conseguir respirar","tosse que termina em vômito","chiado no fim da tosse"]},comuns:{descricao:"Fase catarral com coriza e febrícula, seguida de tosse noturna intensa.",termos:["coriza","febrícula","tosse noturna intensa","cianose durante a tosse","hiperemia conjuntival","esgotamento após a crise","nariz escorrendo","fica roxo quando tosse","tosse pior à noite","fica exausto depois do acesso"]},atipicos:{descricao:"Apneia e bradicardia no lactente, hemorragia subconjuntival e pneumonia secundária.",termos:["apneia em lactente","bradicardia","hemorragia subconjuntival","petéquias em face","convulsão","pneumonia secundária","encefalopatia","bebê para de respirar","olho vermelho de sangue"]}},{id:"perda-auditiva-subita",nome:"Perda auditiva súbita",cid:"H91.2",sistema:"Respiratório e ORL",epidemiologia:"Adultos entre 40 e 60 anos, sem causa identificável na maioria dos casos. Associa-se a infecção viral recente, doença autoimune, trauma acústico, uso de ototóxicos e, raramente, schwannoma vestibular. É urgência otológica.",exameFisico:"Otoscopia bilateral, testes de Weber e Rinne com diapasão, avaliação de nistagmo, exame de pares cranianos e pesquisa de sinais neurológicos focais.",obrigatorios:{descricao:"Hipoacusia neurossensorial unilateral instalada em até 72 horas.",termos:["hipoacusia súbita","surdez súbita","perda auditiva unilateral","hipoacusia neurossensorial","Weber lateralizado para o lado sadio","ficou surdo de um ouvido","parou de escutar de repente","ouvido mudo"]},comuns:{descricao:"Zumbido, plenitude auricular e tontura leve.",termos:["zumbido","acúfeno","plenitude auricular","tontura","desequilíbrio","autofonia","apito no ouvido","ouvido tapado","ouvido cheio","zoando o ouvido"]},atipicos:{descricao:"Vertigem rotatória intensa, nistagmo e déficit de pares cranianos.",termos:["vertigem rotatória","nistagmo","paralisia facial associada","schwannoma vestibular","cefaleia occipital","ataxia","tudo rodando sem parar","boca torta junto"]}},{id:"cerume-impactado",nome:"Cerume impactado (Rolha de cera)",cid:"H61.2",sistema:"Respiratório e ORL",epidemiologia:"Muito frequente em idosos, usuários de aparelho auditivo ou fone intra-auricular, e em quem usa haste flexível de algodão. Conduto estreito e dermatite seborreica favorecem a impactação.",exameFisico:"Otoscopia bilateral antes e depois da remoção, teste de Weber e Rinne, inspeção do conduto quanto a escoriação e avaliação da membrana timpânica após a limpeza.",obrigatorios:{descricao:"Hipoacusia condutiva com conduto auditivo obstruído por cerume à otoscopia.",termos:["cerume impactado","rolha de cerume","conduto obstruído","hipoacusia condutiva","cera no ouvido","ouvido entupido de cera","não escuto desse ouvido","rolha de cera"]},comuns:{descricao:"Plenitude auricular, zumbido e autofonia.",termos:["plenitude auricular","zumbido","autofonia","prurido no conduto","otalgia leve","ouvido tapado","coceira no ouvido","escuto minha própria voz","ouvido abafado"]},atipicos:{descricao:"Tosse reflexa, vertigem e otite externa após manipulação.",termos:["tosse reflexa","vertigem posicional","otite externa secundária","escoriação do conduto","perfuração timpânica","tosse quando mexe no ouvido","machucou o ouvido limpando"]}},{id:"abscesso-peritonsilar",nome:"Abscesso peritonsilar",cid:"J36",sistema:"Respiratório e ORL",epidemiologia:"Adolescentes e adultos jovens, em geral como complicação de amigdalite aguda tratada de forma incompleta. Tabagismo e amigdalite de repetição são fatores de risco.",exameFisico:"Oroscopia com atenção a abaulamento de pilar e desvio de úvula, avaliação da abertura bucal, palpação de linfonodos cervicais e verificação de estridor ou sialorreia.",obrigatorios:{descricao:"Odinofagia intensa unilateral com abaulamento de pilar amigdaliano e desvio de úvula.",termos:["abaulamento de pilar amigdaliano","desvio de úvula","odinofagia unilateral intensa","trismo","voz de batata quente","voz abafada","garganta inchada de um lado","não consigo abrir a boca","dor de garganta insuportável de um lado"]},comuns:{descricao:"Febre alta, sialorreia, otalgia reflexa e linfadenomegalia cervical.",termos:["febre alta","sialorreia","otalgia reflexa","linfadenomegalia cervical","halitose","disfagia","babando","dor no ouvido do mesmo lado","íngua no pescoço","não consegue engolir saliva"]},atipicos:{descricao:"Extensão cervical profunda, obstrução de via aérea e síndrome de Lemierre.",termos:["abscesso cervical profundo","mediastinite","estridor","obstrução de via aérea","síndrome de Lemierre","trombose de veia jugular","enfisema cervical","pescoço inchado e duro","começou a faltar ar"]}},{id:"hipertrofia-adenoamigdaliana",nome:"Hipertrofia adenoamigdaliana",cid:"J35.3",sistema:"Respiratório e ORL",epidemiologia:"Pré-escolares e escolares, com pico entre 3 e 7 anos. Associa-se a amigdalites de repetição, rinite alérgica, exposição a tabagismo passivo e frequência a creche.",exameFisico:"Oroscopia com graduação das amígdalas (Brodsky), inspeção da fácies adenoideana, avaliação da respiração bucal, otoscopia para otite média secretora e ausculta do sono quando possível.",obrigatorios:{descricao:"Respiração bucal com ronco e hipertrofia amigdaliana ou obstrução nasal crônica.",termos:["respiração bucal","hipertrofia amigdaliana","hipertrofia adenoideana","ronco infantil","obstrução nasal crônica","dorme de boca aberta","criança que ronca","amígdalas enormes","respira pela boca o tempo todo"]},comuns:{descricao:"Sono agitado, fácies adenoideana, voz anasalada e otite média secretora.",termos:["sono agitado","fácies adenoideana","voz anasalada","otite média secretora","hipoacusia condutiva","déficit de atenção escolar","sono picado","voz de nariz entupido","não escuta direito na escola","baba no travesseiro"]},atipicos:{descricao:"Apneia obstrutiva do sono na infância, atraso de crescimento e cor pulmonale.",termos:["apneia obstrutiva infantil","pausas respiratórias no sono","atraso de crescimento","enurese noturna","cor pulmonale","alteração do crescimento craniofacial","para de respirar dormindo","voltou a fazer xixi na cama"]}},{id:"doenca-arterial-obstrutiva-periferica",nome:"Doença Arterial Obstrutiva Periférica (DAOP)",cid:"I73.9",sistema:"Cardiovascular",epidemiologia:"Homens acima de 50 anos, tabagistas, diabéticos, hipertensos e dislipidêmicos. Marcador de doença aterosclerótica sistêmica, com risco coronariano e cerebrovascular aumentado.",exameFisico:"Palpação comparativa de pulsos femoral, poplíteo, tibial posterior e pedioso, cálculo do índice tornozelo-braquial, avaliação de perfusão, temperatura, pelos e unhas, e teste de enchimento capilar.",obrigatorios:{descricao:"Claudicação intermitente com pulsos periféricos diminuídos ou ausentes.",termos:["claudicação intermitente","dor em pant
