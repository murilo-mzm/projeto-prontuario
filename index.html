culares e sítios tendíneos (pesquisa de hiperalgesia difusa e tender points), combinada à inspeção e palpação articular completa (obrigatoriamente normal: ausência de sinovite, derrame articular, calor ou limitação mecânica) e exame neurológico normal (força e reflexos preservados).",obrigatorios:{descricao:"Dor musculoesquelética difusa e crônica (>= 3 meses, axial e nos 4 quadrantes corporais) associada a fadiga e sono não reparador, sem sinovite",termos:["dor musculoesquelética difusa crônica","dor generalizada","fadiga crônica","astenia","sono não reparador","fibromialgia","dor no corpo inteiro há meses","dói tudo da cabeça aos pés","acorda mais cansado do que quando dormiu"]},comuns:{descricao:"Hiperalgesia e alodínia à palpação (tender points), distúrbios cognitivos (fibro fog), cefaleia tensional/migrânea, parestesias subjetivas, depressão/ansiedade e SII",termos:["alodínia mecânica","hiperalgesia difusa","tender points dolorosos","disfunção cognitiva","fibro fog","parestesias não dermatoméricas","cefaleia associada","sensação de inchaço subjetivo","qualquer toque no corpo dói","esquecimento e falta de concentração","formigamento nas mãos e pés sem causa"]},atipicos:{descricao:"Dor torácica costocondral intensa (simulando SCA), dor pélvica crônica e urgência miccional funcional",termos:["costocondrite associada","dor torácica miofascial","síndrome da bexiga dolorosa","dor no peito ao apertar as costelas"]}},{id:"mialgia-aguda-estiramento-muscular",nome:"Mialgia aguda / Estiramento muscular",cid:"M79.1",sistema:"Musculoesquelético",epidemiologia:'Praticantes de atividade física/atletas ("atletas de fim de semana" sem aquecimento adequado), praticantes de musculação, trabalhadores braçais, ou usuários de estatinas (sinvastatina, atorvastatina, rosuvastatina) e fibratos (no caso de mialgia difusa induzida por fármacos).',exameFisico:"Inspeção do membro (assimetria, edema, equimose), palpação de todo o ventre muscular e junção miotendínea (identificar ponto doloroso, espasmo ou Sinal do Gap / depressão palpável nas rupturas completas), teste de dor à contração isométrica contra resistência e ao alongamento passivo,Teste de Thompson (compressão da panturrilha) se dor súbita em região posterior do tornozelo para excluir ruptura do tendão de Aquiles.",obrigatorios:{descricao:"Dor muscular localizada desencadeada por esforço/sobrecarga ou trauma, reproduzida pela palpação do ventre muscular e contração contra resistência",termos:["mialgia localizada","estiramento muscular","distensão muscular","dor miofascial aguda","dor à contração isométrica","dor no músculo","músculo puxou","fisgada no músculo","distensão"]},comuns:{descricao:"Edema muscular localizado, espasmo protetor, dor ao alongamento passivo do músculo, limitação funcional antálgica",termos:["espasmo muscular","contratura muscular","edema miofascial","dor ao estiramento passivo","limitação funcional","músculo duro","nó no músculo","dor quando estica o braço/perna"]},atipicos:{descricao:"Gap (depressão) palpável no ventre muscular com hematoma/equimose extensa (ruptura grau III), mialgia difusa com colúria/mioglobinúria (rabdomiólise)",termos:["ruptura muscular completa","sinal do gap palpável","hematoma intramuscular","equimose tardia","rabdomiólise","mioglobinúria","buraco no músculo","mancha roxa grande na perna/braço","sentiu um estalo ou pedrada na panturrilha","urina escura cor de coca-cola após treino pesado"]}},{id:"cefaleia-tensional",nome:"Cefaleia tensional",cid:"G44.2",sistema:"Neurologia e Psiquiatria",epidemiologia:"Cefaleia primária mais prevalente na população geral,adultos jovens e de meia-idade, discreto predomínio feminino,desencadeada por estresse emocional, sobrecarga de trabalho, privação de sono, jejum prolongado, fadiga ocular/telas, bruxismo/DTM e tensão postural cervical.",exameFisico:"Aferição de PA e temperatura, palpação da musculatura pericraniana (frontal, temporal, masseter, pterigoideos, esternocleidomastoideo e trapézio superior para identificar hiperestesia e pontos-gatilho), exame neurológico completo (obrigatoriamente normal) e ausência de rigidez de nuca.",obrigatorios:{descricao:"Cefaleia bilateral, em pressão/aperto (não pulsátil), leve a moderada, não agravada por atividades físicas de rotina",termos:["cefaleia holocraniana","cefaleia bilateral","cefaleia em pressão","cefaleia em aperto","cefaleia não pulsátil","cefaleia tensional","dor de cabeça dos dois lados","dor em capacete","dor em faixa apertando a cabeça","peso na cabeça"]},comuns:{descricao:"Dor frontal, temporal ou suboccipital, ausência de náuseas/vômitos, hiperestesia da musculatura pericraniana à palpação, relação com estresse",termos:["dor fronto-occipital","hiperestesia pericraniana","tensão muscular cervical","ausência de êmese","dor na testa e na nuca","couro cabeludo dolorido","dor de cabeça de estresse/nervoso","dor de cabeça no fim do dia"]},atipicos:{descricao:"Presença isolada de fotofobia leve ou fonofobia leve (nunca ambas nem com náuseas)",termos:["fotofobia leve isolada","fonofobia leve isolada","incômodo leve com barulho","incômodo leve com luz"]}},{id:"enxaqueca-migranea",nome:"Enxaqueca (Migrânea)",cid:"G43.9",sistema:"Neurologia e Psiquiatria",epidemiologia:"Adolescentes e adultos jovens (início entre 10 e 30 anos, pico dos 25 aos 45 anos), forte predomínio no sexo feminino (3:1, relação direta com oscilações estrogênicas/período pré-menstrual),história familiar positiva em > 70% dos casos,gatilhos: jejum, privação ou excesso de sono, estresse, vinho tinto, queijos amarelos, chocolate e odores fortes.",exameFisico:"Sinais vitais, exame neurológico completo (pares cranianos, força motora, coordenação, campimetria visual por confrontação e fundoscopia) e pesquisa de sinais meníngeos para excluir causas secundárias graves (critérios SNOOP: cefaleia em trovoada/HSA, início após os 50 anos, arterite temporal, papiledema ou déficit focal).",obrigatorios:{descricao:"Cefaleia (4-72h) unilateral, pulsátil, moderada a grave e agravada por esforço físico, associada a náuseas/vômitos OU fotofobia e fonofobia",termos:["hemicrania","cefaleia unilateral","cefaleia pulsátil","cefaleia latejante","agravamento ao esforço físico","náuseas","êmese","fotofobia","fonofobia","migrânea","enxaqueca","dor em metade da cabeça","cabeça latejando","coração batendo na cabeça","enjoo e vômito com dor de cabeça","luz e barulho pioram a dor"]},comuns:{descricao:"Aura visual reversível (escotomas cintilantes, espectros de fortificação), osmofobia, alodínia cefálica, necessidade de repouso no escuro",termos:["aura enxaquecosa","escotomas cintilantes","fosfenos","hemianopsia transitória","parestesia queiro-oral","osmofobia","alodínia cutânea","enxerga flashes de luz ou zigue-zague antes da dor","visão embaçada antes da dor","cheiro forte dá dor de cabeça","precisa deitar no quarto escuro"]},atipicos:{descricao:"Aura motora (migrânea hemiplégica), migrânea vestibular (vertigem), estado enxaquecoso (> 72h)",termos:["migrânea hemiplégica","migrânea vestibular","vertigem associada","estado enxaquecoso","enxaqueca que dura mais de 3 dias","tontura rotatória com enxaqueca"]}},{id:"vppb-labirintopatia",nome:"VPPB / Labirintopatia",cid:"H81.1",sistema:"Neurologia e Psiquiatria",epidemiologia:"Adultos > 50 anos e idosos (a VPPB é a causa mais comum de vertigem periférica), predomínio no sexo feminino (2:1),antecedente de TCE leve, repouso prolongado no leito, osteoporose/deficiência de vitamina D, neurite vestibular prévia ou doença de Ménière.",exameFisico:"Manobra de Dix-Hallpike (para canal semicircular posterior: observar nistagmo torsional/vertical superior com latência de segundos, duração < 1 min e fatigabilidade, seguido da Manobra de reposicionamento de Epley), Protocolo HINTS se vertigem aguda contínua (Head Impulse Test, caracterização do Nistagmo e Test of Skew / desalinhamento ocular vertical para excluir AVC cerebelar/tronco), provas cerebelares (índex-nariz, diadococinesia), Teste de Romberg e Fukuda e otoscopia.",obrigatorios:{descricao:"Episódios breves (< 1 min) de vertigem rotatória desencadeados especificamente por mudanças na posição cefálica",termos:["vertigem posicional","vertigem rotatória paroxística","tontura cinética","VPPB","labirintopatia periférica","labirintite","tontura que gira tudo quando mexe a cabeça","quarto rodando ao virar na cama"]},comuns:{descricao:"Vertigem ao deitar, virar na cama ou olhar para cima, náuseas e vômitos autonômicos, nistagmo posicional torsional com latência e fatigabilidade (Dix-Hallpike +), audição normal",termos:["manobra de Dix-Hallpike positiva","nistagmo posicional horizonto-rotatório","latência e fatigabilidade do nistagmo","náuseas","êmese","sudorese fria","ausência de sintomas cocleares","tudo roda quando olha para o alto ou levanta da cama","enjoo forte e vômito com a tontura","cristais do ouvido soltos"]},atipicos:{descricao:"Vertigem contínua independente da posição, nistagmo vertical puro ou multidirecional, teste HINTS central, diplopia, disartria, dismetria, ataxia axial grave",termos:["vertigem central","nistagmo vertical puro","nistagmo bidirecional","HINTS positivo para causa central","desvio skew","ataxia cerebelar","dismetria","disartria","diplopia","tontura que não para nem ficando imóvel","não consegue ficar em pé sozinho","fala enrolada","visão dupla"]}},{id:"avci-ou-ait",nome:"AVCI ou AIT",cid:"I63.9",sistema:"Neurologia e Psiquiatria",epidemiologia:"Adultos > 55 anos e idosos (incidência dobra a cada década após os 55 anos), maior prevalência em negros,fatores de risco maiores: Hipertensão Arterial (principal fator), Fibrilação Atrial (causa cardioembólica), diabetes mellitus, tabagismo, dislipidemia, estenose carotídea, doença de Chagas, anemia falciforme (crianças/jovens) e trombofilias/anticoncepcionais (jovens).",exameFisico:"Aplicação imediata da escala NIHSS (e escala de Cincinnati/FAST na triagem), aferição de glicemia capilar imediata (excluir hipoglicemia mimetizadora de AVC), PA, avaliação da linguagem (fluência, compreensão, repetição e nomeação), campimetria visual, pares cranianos (diferenciar paralisia facial central [poupa a testa] da periférica), força motora (Manobra de Mingazzini e Raimiste), sensibilidade, coordenação, pesquisa do Sinal de Babinski e ausculta cardíaca/carotídea.",obrigatorios:{descricao:"Déficit neurológico focal de início hiperagudo (súbito), correspondente a um território vascular encefálico",termos:["déficit neurológico focal súbito","ictal","acidente vascular cerebral","ataque isquêmico transitório","síndrome neurovascular aguda","derrame","AVC","princípio de derrame","isquemia cerebral"]},comuns:{descricao:"Hemiparesia/hemiplegia, hipoestesia unilateral, paralisia facial central (desvio de rima labial poupando a fronte), afasia ou disartria, hemianopsia, desvio do olhar",termos:["hemiparesia","hemiplegia faciobraquiocrural","hipoestesia dimidiada","paralisia facial central","apagamento de sulco nasogeniano","afasia de Broca","afasia de Wernicke","disartria","hemianopsia homônima","desvio conjugado do olhar","perda de força de um lado do corpo","braço e perna esquecidos/paralisados","boca torta","fala enrolada","não consegue falar ou entender","perdeu metade da visão"]},atipicos:{descricao:"Amaurose fugaz (cegueira monocular transitória), confusão aguda isolada ou heminegligência, vertigem com ataxia e disfagia (Wallenberg), crise epiléptica inaugural",termos:["amaurose fugaz","cegueira monocular transitória","heminegligência espacial","síndrome de Wallenberg","disfagia neurogênica aguda","ataxia aguda","cortina preta fechando a visão de um olho só","engasgando de repente com voz rouca e tontura"]}},{id:"crise-epileptica-convulsiva",nome:"Crise epiléptica convulsiva",cid:"G40.9",sistema:"Neurologia e Psiquiatria",epidemiologia:"Distribuição bimodal: crianças (crises febris dos 6 meses aos 5 anos, epilepsias genéticas ou hipóxia perinatal) e idosos > 60 anos (sequela de AVC prévio, tumores cerebrais, demência de Alzheimer),em adultos jovens: privação de sono, má adesão aos anticonvulsivantes, abstinência alcoólica, TCE, neurocisticercose (endêmica no Brasil) ou distúrbios metabólicos.",exameFisico:"Avaliação de ABCDE, glicemia capilar imediata, oximetria e sinais vitais, Escala de Coma de Glasgow, avaliação pupilar (simetria e fotorreação), inspeção da cavidade oral (mordedura na borda lateral da língua tem altíssima especificidade para crise epiléptica), pesquisa de déficits neurológicos focais pós-ictais (Paralisia de Todd), pesquisa de rigidez de nuca (excluir meningite/HSA) e inspeção de estigmas de trauma craniano.",obrigatorios:{descricao:"Atividade motora tônica e/ou clônica involuntária associada a perda abrupta da consciência (nas crises generalizadas) ou manifestação motora/disperceptiva focal",termos:["crise tônico-clônica generalizada","convulsão","crise epiléptica","hipertonia axial","abalos clônicos bilaterais","perda súbita de consciência","ataque epiléptico","caiu no chão se batendo todo","ficou duro e tremendo"]},comuns:{descricao:"Cianose labial, sialorreia espumosa, mordedura lateral da língua, liberação esfincteriana, versão ocular/cefálica, estado pós-ictal (sonolência profunda, confusão e mialgia)",termos:["cianose perioral","sialorreia","mordedura lateral de língua","incontinência esfincteriana","liberação vesical/anal","revulsão ocular","versão cefálica","período pós-ictal","sonolência pós-ictal","confusão pós-ictal","boca roxa","espumando pela boca","mordeu a língua","fez xixi na roupa durante a crise","olhos viraram para cima","acordou muito confuso e sonolento"]},atipicos:{descricao:"Paralisia de Todd (hemiparesia transitória pós-ictal), crise focal disperceptiva com automatismos, estado de mal epiléptico (> 5 min ou sem recuperar consciência)",termos:["paralisia de Todd","paresia pós-ictal","crise focal disperceptiva","automatismos oromandibulares","estado de mal epiléptico","status epilepticus","convulsão que não para","uma crise atrás da outra sem acordar","ficou com o braço fraco depois da convulsão"]}},{id:"paralisia-facial-periferica-bell",nome:"Paralisia facial periférica (Bell)",cid:"G51.0",sistema:"Neurologia e Psiquiatria",epidemiologia:"Adultos de 15 a 45 anos, sem predileção por sexo,incidência 3x maior em gestantes (especialmente no 3º trimestre e primeira semana pós-parto), portadores de diabetes mellitus, hipertensos e após infecção viral herpética (HSV-1 ou Varicela-Zoster).",exameFisico:"Avaliação dinâmica da mímica facial solicitando ao paciente: 1) Franzir a testa/erguer as sobrancelhas (ausência de rugas frontais no lado afetado confirma lesão periférica infranuclear), 2) Fechar os olhos com força (observa-se lagoftalmo e o Sinal de Bell – rotação superior do globo ocular), 3) Sorrir/mostrar os dentes e inflar as bochechas,otoscopia e inspeção do pavilhão auricular obrigatórias (procurar vesículas herpéticas da Síndrome de Ramsay Hunt) e exame completo dos demais pares cranianos e força em membros (excluir AVC de ponte).",obrigatorios:{descricao:"Paresia ou paralisia aguda unilateral da hemiface acometendo simultaneamente o andar superior (fronte/olho) e o andar inferior (boca)",termos:["paralisia facial periférica","paralisia de Bell","paresia de hemiface completa","lesão infranuclear do VII par craniano","rosto todo paralisado de um lado","boca torta e olho que não fecha"]},comuns:{descricao:"Apagamento das rugas frontais e sulco nasogeniano, lagoftalmo, Sinal de Bell positivo, desvio da rima labial para o lado sadio, hiperacusia, ageusia anterior, dor retroauricular",termos:["apagamento de pregas frontais","lagoftalmo","sinal de Bell positivo","desvio de comissura labial","epífora","hiperacusia","disgeusia/ageusia nos dois terços anteriores da língua","dor retroauricular prodrômica","não consegue franzir a testa nem levantar a sobrancelha","olho fica aberto e lacrimejando","boca puxando para o lado bom","água escorre pelo canto da boca","dor atrás da orelha"]},atipicos:{descricao:"Vesículas no pavilhão auricular/conduto com vertigem e hipoacusia (Síndrome de Ramsay Hunt), paralisia facial bilateral (Guillain-Barré)",termos:["síndrome de Ramsay Hunt","herpes zoster oticus","vesículas auriculares","vertigem associada","diplegia facial","paralisia facial bilateral","bolhinhas na orelha junto com a boca torta"]}},{id:"tag-crise-de-panico-aguda",nome:"TAG / Crise de pânico aguda",cid:"F41.0",sistema:"Neurologia e Psiquiatria",epidemiologia:"Adolescentes e adultos jovens (início típico entre 18 e 35 anos), predomínio no sexo feminino (2:1),história familiar de transtornos ansiosos, estressores psicossociais agudos (luto, conflitos familiares, esgotamento profissional/burnout), uso excessivo de cafeína/energéticos/pré-treinos, simpaticomiméticos ou abstinência de álcool/benzodiazepínicos.",exameFisico:"Sinais vitais e oximetria de pulso (SpO2 tipicamente 99-100% apesar da queixa de falta de ar severa), ausculta cardiopulmonar (taquicardia sinusal com ausculta pulmonar limpa, excluindo asma, TEP ou pneumotórax), exame neurológico normal e Exame do Estado Mental (paciente hipervigilante, ansioso, orientado, sem déficits focais).",obrigatorios:{descricao:"Ansiedade/preocupação excessiva crônica (TAG) ou surto abrupto de medo intenso/pânico acompanhado de descarga autonômica aguda (Ataque de Pânico)",termos:["crise de ansiedade aguda","ataque de pânico","transtorno de ansiedade generalizada","descarga adrenérgica","hiperatividade autonômica","crise de pânico","crise de nervoso","ansiedade forte","angústia no peito"]},comuns:{descricao:"Palpitações, taquicardia, sudorese, tremores, dispneia suspirosa (sensação de sufocamento), aperto torácico, parestesias periorais/acrais por hiperventilação, medo de morrer/enlouquecer",termos:["palpitações","taquicardia sinusal","diaforese","tremores de extremidades","dispneia suspirosa","hiperventilação","parestesia perioral","parestesia acral","precordialgia atípica","medo de morte iminente","tanatofobia","insônia inicial","coração disparado","falta de ar que não enche o pulmão","boca e mãos formigando","mãos suando frio","medo de estar infartando ou ficando louco"]},atipicos:{descricao:'Espasmo carpopedal ("mão de parteiro" por alcalose respiratória), despersonalização/desrealização, globus faríngeo com afonia conversiva',termos:["espasmo carpopedal","tetania por hiperventilação","mão de parteiro","despersonalização","desrealização","globus histérico","mãos travadas e tortas durante a crise de choro/nervoso","sensação de estar fora do próprio corpo"]}},{id:"episodio-depressivo",nome:"Episódio depressivo",cid:"F32.9",sistema:"Neurologia e Psiquiatria",epidemiologia:"Adolescentes, adultos e idosos, predomínio no sexo feminino (2:1), puérperas (depressão pós-parto),história pessoal ou familiar de transtornos de humor ou suicídio, portadores de doenças crônicas incapacitantes (dor crônica, câncer, pós-IAM, pós-AVC, hipotireoidismo), isolamento social, desemprego e luto.",exameFisico:"Exame Psíquico / Estado Mental (avaliar aparência/autocuidado, atitude, psicomotricidade [lentificação/hipomimia facial], humor hipotímico, afeto embotado, discurso em tom baixo/bradilálico, conteúdo do pensamento [ideias de ruína, culpa, desesperança] e avaliação ativa e estruturada de risco de suicídio), além de exame físico geral e palpação da tireoide (excluir hipotireoidismo/anemia).",obrigatorios:{descricao:"Humor deprimido na maior parte do dia e/ou perda acentuada de interesse ou prazer (anedonia) por >= 2 semanas",termos:["humor deprimido","hipotimia","tristeza patológica","anedonia","perda de interesse","apatia","episódio depressivo","depressão","tristeza profunda","não tem vontade de fazer mais nada","perdeu a graça na vida"]},comuns:{descricao:"Fadiga/perda de energia, insônia (especialmente terminal) ou hipersonia, anorexia/perda de peso ou hiperfagia, culpa excessiva, inutilidade, lentificação psicomotora, ideação suicida",termos:["astenia","anergia","insônia terminal","despertar precoce","hipersonia","hiporexia","perda ponderal","ideias de menos-valia","culpa patológica","bradipsiquismo","lentificação psicomotora","hipoprossexia","ideação suicida","choro fácil","sem energia para sair da cama","acorda de madrugada e não dorme mais","se sente um peso/inútil","pensamentos de morte","vontade de sumir"]},atipicos:{descricao:"Depressão somatizada/mascarada em idosos (dores crônicas e pseudodemência), agitação psicomotora, delírios congruentes com o humor (ruína/culpa)",termos:["somatização","pseudodemência depressiva","depressão psicótica","delírio de ruína","delírio de Cotard","agitação psicomotora","idoso que só reclama de dores no corpo e esquecimento"]}},{id:"intoxicacao-abstinencia-alcoolica",nome:"Intoxicação / Abstinência alcoólica",cid:"F10.0",sistema:"Neurologia e Psiquiatria",epidemiologia:"Adolescentes e adultos jovens em eventos festivos (intoxicação aguda),adultos de meia-idade e idosos do sexo masculino com histórico de transtorno por uso de álcool crônico, desnutrição, hepatopatia, população em situação de rua ou pacientes internados por outras causas que interrompem a ingesta abruptamente (abstinência).",exameFisico:"Sinais vitais e glicemia capilar imediata, Escala de Coma de Glasgow, inspeção rigorosa do crânio e pupilas (descartar hematoma subdural agudo por queda em etilistas), pesquisa de nistagmo, ataxia e oftalmoplegia (Encefalopatia de Wernicke - administrar tiamina antes da glicose), e aplicação da escala CIWA-Ar na abstinência (avaliar tremores com braços estendidos, sudorese, agitação, orientação e alucinações táteis/visuais).",obrigatorios:{descricao:"Alterações neurológicas/comportamentais agudas pós-ingesta etílica (intoxicação) OU hiperatividade autonômica/tremores após redução/cessação do álcool (abstinência)",termos:["intoxicação exógena por etanol","embriaguez aguda","síndrome de abstinência alcoólica","etilismo agudo","bêbado","alcoolizado","passou mal de tanto beber","crise de abstinência de bebida"]},comuns:{descricao:"Intoxicação: hálito etílico, disartria, marcha atáxica, nistagmo, torpor. Abstinência: tremores grosseiros de mãos e língua, sudorese profusa, taquicardia, hipertensão, náuseas, ansiedade",termos:["hálito etílico","disartria","ataxia cerebelar","incoordenação motora","rebaixamento do nível de consciência","tremores intencionais/posturais","diaforese","taquicardia","hipertensão arterial","náuseas","ansiedade","cheiro de álcool","fala enrolada","andando trançando as pernas","mãos tremendo muito sem beber","suando em bicas"]},atipicos:{descricao:"Convulsões por abstinência (12-48h), alucinose alcoólica (zoopsias), Delirium Tremens (confusão grave, alucinações, febre, taquicardia após 48-72h), hipoglicemia/cetoacidose alcoólica",termos:["delirium tremens","alucinose alcoólica","zoopsias","alucinações visuais e táteis","crise convulsiva por abstinência","hipoglicemia induzida por álcool","cetoacidose alcoólica","vendo bichos na parede e no corpo","muito agitado e confuso após parar de beber"]}},{id:"agitacao-psicomotora-surto-psicotico",nome:"Agitação psicomotora / Surto psicótico",cid:"F23.9",sistema:"Neurologia e Psiquiatria",epidemiologia:"Primeiro surto psicótico / Esquizofrenia: adolescentes e adultos jovens (homens 15-25 anos,mulheres 25-35 anos), portadores de transtorno afetivo bipolar (fase maníaca), usuários de substâncias psicoativas (cocaína, crack, anfetaminas, cannabis, alucinógenos) ou má adesão aos antipsicóticos. (Em idosos sem histórico psiquiátrico, considerar Delirium orgânico até que se prove o contrário).",exameFisico:"Sinais vitais, oximetria e glicemia capilar (excluir hipóxia, hipoglicemia, sepse/meningite ou intoxicação exógena), avaliação pupilar (midríase simpaticomimética vs. miose), exame neurológico sumário e Exame do Estado Mental (nível de consciência e atenção preservados na psicose primária vs. flutuantes no delirium,avaliação de sensopercepção [alucinações], curso/conteúdo do pensamento [delírios], juízo crítico e risco de hetero/autoagressividade).",obrigatorios:{descricao:"Perda aguda do contato com a realidade caracterizada por delírios, alucinações, discurso desorganizado ou comportamento gravemente desorganizado/agitado",termos:["psicose aguda","surto psicótico","delírios","alucinações","agitação psicomotora","perda do juízo crítico da realidade","desorganização do pensamento","fora da realidade","surtou","falando coisas sem sentido"]},comuns:{descricao:"Delírios persecutórios ou místicos/grandeza, alucinações auditivas (vozes de comando), heteroagressividade, hostilidade, paranoia, insônia total, solilóquios",termos:["delírio persecutório","delírio autorreferente","delírio místico","alucinação auditiva","vozes de comando","heteroagressividade","hostilidade","solilóquios","insônia","acha que estão perseguindo ou querendo matar ele","ouvindo vozes que mandam fazer coisas","falando sozinho","quebrando tudo","agressivo"]},atipicos:{descricao:"Catatonia aguda (mutismo, estupor, negativismo, flexibilidade cérea), recusa alimentar/hídrica absoluta",termos:["síndrome catatônica","mutismo","estupor catatônico","negativismo","flexibilidade cérea","ecolalia","ecopraxia","ficou estátua sem falar e sem se mexer","não come nem bebe nada"]}},{id:"insonia-primaria-ou-nao-organica",nome:"Insônia primária ou não orgânica",cid:"F51.0",sistema:"Neurologia e Psiquiatria",epidemiologia:"Adultos e idosos, predomínio no sexo feminino,trabalhadores em regime de turnos/plantonistas noturnos, má higiene do sono (exposição a telas/luz azul à noite), consumo vespertino de cafeína/estimulantes, ansiedade, depressão, estresse financeiro/ocupacional e sedentarismo.",exameFisico:"Aferição de PA, FC, IMC e circunferência cervical (pesquisar risco de Apneia Obstrutiva do Sono associada), oroscopia (Classificação de Mallampati), palpação da tireoide e pesquisa de tremor fino de extremidades (excluir hipertireoidismo) e avaliação do estado mental (rastrear ansiedade e depressão).",obrigatorios:{descricao:"Dificuldade para iniciar o sono, manter o sono ou despertar precoce com prejuízo funcional diurno",termos:["insônia inicial","insônia de manutenção","insônia intermediária","insônia terminal","distúrbio do sono","insônia","não consegue pegar no sono","acorda várias vezes à noite","perde o sono de madrugada"]},comuns:{descricao:"Fadiga diurna, sonolência, irritabilidade, cefaleia matinal, hiperalerta condicionado ao deitar, dificuldade de concentração",termos:["fadiga diurna","sonolência diurna","irritabilidade","hipoprossexia","cefaleia matinal","ansiedade noturna","passa a noite em claro rolando na cama","mente não desliga à noite","cansado e irritado durante o dia"]},atipicos:{descricao:"Percepção paradoxal do sono (pseudoinsônia), microepisódios de sono diurno involuntário",termos:["insônia paradoxal","pseudoinsônia","hipnagoga","jura que não pregou o olho a noite toda","cochila sem perceber durante o dia"]}},{id:"diabetes-mellitus-tipo-2",nome:"Diabetes Mellitus tipo 2",cid:"E11.9",sistema:"Endócrino e Hematologia",epidemiologia:"Adultos > 35-45 anos e idosos (crescente em adolescentes obesos),obesidade central/sobrepeso, sedentarismo, história familiar em parentes de 1º grau, mulheres com antecedente de Diabetes Gestacional ou Síndrome dos Ovários Policísticos (SOP), hipertensos, dislipidêmicos e usuários crônicos de glicocorticoides ou antipsicóticos atípicos.",exameFisico:"Cálculo de IMC e medida da circunferência abdominal, aferição de PA (em decúbito e ortostatismo), inspeção de pele para marcadores de resistência insulínica (acantose nigricans e acrocórdons em pescoço e axilas), fundoscopia direta e Exame do Pé Diabético (inspeção de calosidades/úlceras, micose interdigital, palpação de pulsos pedioso e tibial posterior, teste de sensibilidade protetora com monofilamento de Semmes-Weinstein de 10g e sensibilidade vibratória com diapasão de 128 Hz).",obrigatorios:{descricao:"Hiperglicemia crônica documentada ou síndrome hiperglicêmica osmótica clássica",termos:["hiperglicemia","diabetes mellitus","descompensação glicêmica","glicemia elevada","açúcar alto no sangue","diabetes descontrolada","glicose nas alturas"]},comuns:{descricao:'Assintomático no início,na descompensação: poliúria, polidipsia, polifagia e perda ponderal inexplicada ("4 Ps"), visão turva, astenia, candidíase/infecções de repetição',termos:["poliúria","polidipsia","polifagia","perda ponderal involuntária","turvação visual","astenia","noctúria","balanopostite de repetição","vulvovaginite de repetição","dificuldade de cicatrização","urinando muito e toda hora","sede excessiva","boca seca","muita fome mas está emagrecendo","visão embaçada","ferida que demora para cicatrizar"]},atipicos:{descricao:'Parestesias e dor em queimação "em bota e luva" (neuropatia diabética), mal perfurante plantar, gastroparesia, acantose nigricans',termos:["polineuropatia diabética simétrica distal","parestesia em bota e luva","dor neuropática plantar","úlcera neuropática plantar","mal perfurante plantar","acantose nigricans","formigamento e queimação nos pés à noite","pés dormentes","ferida na sola do pé que não dói","mancha escura e grossa no pescoço"]}},{id:"cetoacidose-diabetica-estado-hiperosmolar",nome:"Cetoacidose diabética / Estado Hiperosmolar",cid:"E10.1",sistema:"Endócrino e Hematologia",epidemiologia:'CAD: crianças, adolescentes e adultos jovens com DM tipo 1 (frequentemente como primodescompensação inaugural ou omissão de insulina) ou DM2 sob estresse infeccioso/uso de inibidores de SGLT2. EHH: idosos com DM tipo 2, acamados ou com acesso restrito à água,fatores precipitantes ("5 Is"): Infecção (ITU, pneumonia, pé diabético), Infarto (IAM/AVC), Insulina (má adesão), Intoxicação (álcool/cocaína) e Inflamação (pancreatite).',exameFisico:"Monitorização de sinais vitais (PA, FC, FR, Tax, SpO2), avaliação do nível de consciência (Glasgow), avaliação do padrão respiratório (Respiração de Kussmaul – incursões profundas e rápidas compensatórias da acidose metabólica) e hálito cetônico, avaliação severa de desidratação (mucosas secas, turgor, perfusão periférica), palpação abdominal e busca ativa do foco infeccioso precipitante (ausculta pulmonar, inspeção de pés/períneo e punho-percussão lombar).",obrigatorios:{descricao:"Hiperglicemia severa associada a desidratação grave e sinais clínicos de acidose metabólica/cetose (CAD) ou neuroglicopenia/hiperosmolaridade (EHH)",termos:["cetoacidose diabética","estado hiperglicêmico hiperosmolar","hiperglicemia grave","acidose metabólica","cetonemia","cetonúria","diabetes muito alta passando mal","sangue ácido pela diabetes"]},comuns:{descricao:"Desidratação grave (mucosas secas, taquicardia, hipotensão), poliúria evoluindo para oligúria, náuseas, vômitos intensos, dor abdominal difusa (CAD), Respiração de Kussmaul, hálito cetônico",termos:["desidratação grave","hipovolemia","taquicardia","hipotensão","náuseas","êmese incoercível","dor abdominal difusa","respiração de Kussmaul","taquipneia acidótica","hálito cetônico","poliúria","vomitando sem parar","dor forte na barriga","respirando muito fundo e rápido","hálito com cheiro de fruta passada/acetona","boca seca e olhos fundos"]},atipicos:{descricao:"Coma hiperosmolar, crises convulsivas focais e déficits motores transitórios (EHH em idosos), CAD euglicêmica (usuários de iSGLT2), hipotermia",termos:["torpor","coma hiperosmolar","crise convulsiva focal","rebaixamento do nível de consciência","cetoacidose euglicêmica","hipotermia","idoso diabético ficou muito sonolento e não acorda"]}},{id:"hipoglicemia-aguda",nome:"Hipoglicemia aguda",cid:"E16.2",sistema:"Endócrino e Hematologia",epidemiologia:"Diabéticos em uso de insulina ou secretagogos de insulina (sulfonilureias: glibenclamida, gliclazida, glimepirida),idosos, portadores de doença renal crônica ou insuficiência hepática (redução da depuração da insulina e da gliconeogênese), jejum prolongado ou exercício físico sem ajuste de dose, e etilistas agudos em jejum.",exameFisico:"Glicemia capilar imediata (HGT), avaliação do nível de consciência (Glasgow), inspeção de pele (palidez e sudorese fria profusa), pesquisa de tremores finos de extremidades, frequência cardíaca e exame neurológico completo antes e reavaliação imediata após a infusão de glicose hipertônica (para documentar a reversão completa de eventuais déficits focais).",obrigatorios:{descricao:"Tríade de Whipple: sintomas autonômicos e/ou neuroglicopênicos associados a glicemia capilar/plasmática baixa (< 70 mg/dL), com reversão após glicose",termos:["hipoglicemia aguda","tríade de Whipple","neuroglicopenia","glicemia capilar baixa","queda da glicose","açúcar no sangue baixou demais","crise de hipoglicemia"]},comuns:{descricao:"Autonômicos: tremores finos, sudorese fria profusa, palpitações, taquicardia, ansiedade, fome intensa, palidez. Neuroglicopênicos: confusão mental, disartria, visão turva, sonolência",termos:["tremores de extremidades","diaforese fria profusa","palpitações","taquicardia","palidez cutânea","fome súbita","confusão mental aguda","disartria","diplopia","turvação visual","sonolência","suando frio de molhar a roupa","tremendo muito","fome desesperadora","ficou pálido e gelado","falando enrolado parecendo bêbado","ficou confuso depois de aplicar insulina"]},atipicos:{descricao:"Hemiplegia aguda transitória (simulando AVCI), crises convulsivas tônico-clônicas, coma profundo sem pródromos autonômicos (hypoglycemia unawareness)",termos:["déficit neurológico focal hipoglicêmico","hemiparesia transitória","crise convulsiva hipoglicêmica","coma hipoglicêmico","hipoglicemia assintomática/sem percepção","desmaiou direto sem sentir suor antes","paralisou um lado do corpo por glicose baixa"]}},{id:"hipotireoidismo-primario",nome:"Hipotireoidismo primário",cid:"E03.9",sistema:"Endócrino e Hematologia",epidemiologia:"Mulheres (5 a 8x mais comum que em homens), adultos > 40-50 anos e idosos,antecedente pessoal ou familiar de doenças autoimunes (Tireoidite de Hashimoto, DM1, vitiligo, doença celíaca), puérperas (tireoidite pós-parto), história de tireoidectomia, radioiodoterapia, radioterapia cervical, síndrome de Down/Turner ou uso de amiodarona e lítio.",exameFisico:"Sinais vitais (FC/bradicardia, PA diastólica elevada, Tax), inspeção geral (fácies mixedematosa, edema periorbitário, pele seca/fria, madarose no terço distal das sobrancelhas, voz rouca), palpação da glândula tireoide (bócio difuso fibroelástico no Hashimoto ou tireoide atrófica), pesquisa de edema duro sem cacifo (mixedema pré-tibial) e pesquisa do reflexo aquileu (fase de relaxamento muscular caracteristicamente lentificada – Sinal de Woltman).",obrigatorios:{descricao:"Síndrome hipometabólica sistêmica associada à deficiência de hormônios tireoidianos (TSH elevado e T4 livre baixo)",termos:["hipotireoidismo","síndrome hipometabólica","elevação de TSH","tireoide lenta","problema de tireoide"]},comuns:{descricao:"Fadiga, letargia, intolerância ao frio, ganho ponderal discreto, constipação intestinal, pele seca e áspera (xerodermia), alopecia, unhas quebradiças, bradicardia, voz rouca/arrastada, reflexos lentificados",termos:["astenia","letargia","sonolência","intolerância ao frio","ganho ponderal","edema mixedematoso","constipação intestinal","xerodermia","alopecia difusa","bradicardia","voz rouca","bradipsiquismo","hiporreflexia com relaxamento lento","cansaço constante","sente muito mais frio que os outros","inchado","intestino muito preso","pele ressecada","cabelo caindo muito","unhas fracas"]},atipicos:{descricao:"Madarose (perda do terço distal das sobrancelhas), síndrome do túnel do carpo bilateral, menorragia, derrame pericárdico, Coma Mixedematoso",termos:["madarose","síndrome do túnel do carpo","menorragia","derrame pericárdico","coma mixedematoso","hipotermia grave","hiponatremia","falha no final da sobrancelha","mãos dormentes"]}},{id:"dislipidemia",nome:"Dislipidemia",cid:"E78.5",sistema:"Endócrino e Hematologia",epidemiologia:"Adultos e idosos,história familiar de dislipidemia ou DAC precoce (suspeitar de Hipercolesterolemia Familiar se LDL > 190 mg/dL), obesidade, sedentarismo, dieta rica em gorduras saturadas/trans e carboidratos simples,causas secundárias: hipotireoidismo, DM2 descompensado, síndrome nefrótica, colestase, etilismo e uso de tiazídicos, retinoides ou antirretrovirais.",exameFisico:"Cálculo de IMC, medida da circunferência abdominal, aferição de PA, palpação de pulsos arteriais periféricos e ausculta de carótidas/artérias femorais (rastrear aterosclerose subclínica), e inspeção dirigida para estigmas de dislipidemia genética: xantelasmas nas pálpebras, arco corneano senil precoce (< 45 anos) e xantomas tendinosos (palpação do tendão de Aquiles e extensores das mãos) ou eruptivos.",obrigatorios:{descricao:"Elevação sérica de colesterol total, LDL-c, triglicerídeos e/ou redução de HDL-c",termos:["dislipidemia","hipercolesterolemia","hipertrigliceridemia","dislipidemia mista","colesterol alto","triglicérides alto","gordura no sangue"]},comuns:{descricao:"Essencialmente assintomática em atendimentos de rotina",termos:["assintomático","achado laboratorial de rotina","exame de sangue alterado sem sintomas"]},atipicos:{descricao:"Xantelasmas palpebrais, xantomas tendinosos/tuberosos, arco corneano precoce, xantomas eruptivos e pancreatite aguda (quando triglicerídeos > 1000 mg/dL)",termos:["xantelasma palpebral","xantoma tendinoso","xantoma eruptivo","arco corneano juvenil","lipemia retinalis","dor abdominal aguda por hipertrigliceridemia","bolsinhas amarelas de gordura nas pálpebras","caroços nos tendões","soro do sangue branco igual leite"]}},{id:"obesidade-e-sindrome-metabolica",nome:"Obesidade e Síndrome Metabólica",cid:"E66.9",sistema:"Endócrino e Hematologia",epidemiologia:"Todas as faixas etárias (crescente prevalência na infância e adolescência),sedentarismo, dieta hipercalórica/ultraprocessada, história familiar, privação de sono, transtorno da compulsão alimentar, SOP, hipotireoidismo, síndrome de Cushing e uso de psicotrópicos (olanzapina, clozapina, risperidona, mirtazapina, valproato) ou corticoides.",exameFisico:"Antropometria completa (Peso, Altura, cálculo do IMC, medida da Circunferência Abdominal [>= 94/102 cm em homens e >= 80/88 cm em mulheres] e Circunferência Cervical), aferição de PA com manguito de obeso, inspeção de pele (acantose nigricans, acrocórdons, intertrigo nas dobras e estrias violáceas largas > 1 cm para excluir síndrome de Cushing), palpação hepática e avaliação articular de joelhos.",obrigatorios:{descricao:"IMC >= 30 kg/m² e/ou adiposidade visceral aumentada (circunferência abdominal elevada) associada a resistência insulínica, hipertensão e dislipidemia",termos:["obesidade","sobrepeso","adiposidade central","obesidade visceral","circunferência abdominal aumentada","síndrome metabólica","excesso de peso","acima do peso","barriga grande"]},comuns:{descricao:"Dispneia aos esforços, intolerância ao exercício, artralgias mecânicas (joelhos e coluna), roncopatia e apneia obstrutiva do sono, sonolência diurna, acantose nigricans, esteatose hepática",termos:["dispneia aos esforços","gonartralgia mecânica","lombalgia mecânica","roncopatia","síndrome da apneia e hipopneia obstrutiva do sono","SAHOS","sonolência diurna excessiva","acantose nigricans","acrocórdons","esteatose hepática","falta de ar ao caminhar","dor nos joelhos pelo peso","ronca muito alto e engasga dormindo","pescoço escuro","gordura no fígado"]},atipicos:{descricao:"Síndrome de Hipoventilação da Obesidade (Pickwick: hipoxemia e hipercapnia diurna com cor pulmonale), intertrigo candidiásico nas dobras, hipertensão intracraniana idiopática",termos:["síndrome de hipoventilação da obesidade","síndrome de Pickwick","hipercapnia crônica","intertrigo em dobras cutâneas","pseudotumor cerebri","assadura debaixo da barriga e das mamas","sonolência extrema e lábios roxos"]}},{id:"desidratacao-e-disturbios-hidroeletroliticos",nome:"Desidratação e Distúrbios hidroeletrolíticos",cid:"E86",sistema:"Endócrino e Hematologia",epidemiologia:"Extremos de idade: lactentes e crianças pequenas (alta superfície corporal e imaturidade renal,diarreia aguda/vômitos) e idosos frágeis/acamados/demenciados (perda do reflexo da sede, dependência de cuidadores),usuários de diuréticos (tiazídicos causam hiponatremia/hipocalemia,espironolactona/IECA causam hipercalemia), ondas de calor extremo, febre alta prolongada ou ileostomizados.",exameFisico:"Sinais vitais com pesquisa de hipotensão ortostática e taquicardia postural, avaliação do nível de consciência, inspeção da umidade da mucosa jugal/língua, globo ocular (enoftalmia/olhos encovados), palpação da fontanela anterior em lactentes, pesquisa do Sinal da Prega Cutânea (turgor abdominal/subclavicular), Tempo de Enchimento Capilar (< 2s vs. prolongado) e exame neurológico/força muscular (hiporreflexia/paresia na hipocalemia).",obrigatorios:{descricao:"Sinais clínicos de depleção do volume extracelular/intracelular e/ou alterações laboratoriais de sódio/potássio",termos:["desidratação","hipovolemia","depleção volêmica","distúrbio hidroeletrolítico","hiponatremia","hipernatremia","hipocalemia","hipercalemia","corpo desidratado","falta de água e sais no corpo"]},comuns:{descricao:"Sede intensa, mucosas orais secas, língua saburrosa, turgor cutâneo diminuído (sinal da prega +), enchimento capilar lento, taquicardia, hipotensão postural, oligúria, olhos encovados",termos:["polidipsia","xerostomia","mucosas secas","sinal da prega positivo","turgor e elasticidade diminuídos","tempo de enchimento capilar prolongado","taquicardia","hipotensão ortostática","oligúria","enoftalmia","fontanela deprimida","muita sede","boca seca sem saliva","pele murcha que demora a voltar","olhos fundos","tontura ao ficar em pé","pouca urina e muito amarela","moleira baixa no bebê"]},atipicos:{descricao:"Letargia, confusão e convulsões (hiponatremia/hipernatremia grave), tetraparesia flácida ascendente, cãibras e íleo paralítico (hipocalemia grave)",termos:["encefalopatia hiponatrêmica","delirium","crise convulsiva","tetraparesia flácida hipocalêmica","fraqueza muscular generalizada","cãibras musculares","íleo paralítico","sódio muito baixo dando confusão","potássio baixo dando fraqueza nas pernas e cãibras"]}},{id:"anemia-ferropriva",nome:"Anemia ferropriva",cid:"D50.9",sistema:"Endócrino e Hematologia",epidemiologia:"Lactentes de 6 a 24 meses (desmame precoce, introdução de leite de vaca integral e falta de suplementação profilática), gestantes, mulheres em idade fértil (hipermenorreia/miomatose uterina), vegetarianos/veganos estritos, pacientes pós-cirurgia bariátrica (bypass gástrico), portadores de doença celíaca, parasitoses (ancilostomíase) e adultos > 50 anos / idosos (nos quais deve-se investigar obrigatoriamente perda sanguínea oculta por neoplasia gastrointestinal: câncer colorretal ou gástrico).",exameFisico:"Inspeção da coloração da conjuntiva palpebral inferior, mucosa oral, pregas palmares e leito ungueal (graduar palidez de + a 4+), inspeção da língua (glossite atrófica / língua despapilada), comissuras labiais (queilite angular) e unhas (coiloníquia / unhas em colher), ausculta cardíaca (taquicardia e sopro sistólico funcional hiperdinâmico pancardíaco) e pesquisa de sangue oculto/toque retal em idosos.",obrigatorios:{descricao:"Síndrome anêmica clínica (hipocoramento cutâneo-mucoso e astenia) associada a anemia microcítica e hipocrômica com ferritina reduzida",termos:["síndrome anêmica","anemia ferropriva","anemia microcítica hipocrômica","hipoferritinemia","ferropenia","anemia","falta de ferro no sangue","sangue fraco"]},comuns:{descricao:"Palidez cutâneo-mucosa (conjuntiva ocular, palmas, leito ungueal), fadiga/astenia crônica, adinamia, dispneia aos esforços, palpitações, taquicardia, cefaleia, tontura postural, irritabilidade",termos:["palidez cutâneo-mucosa","mucosas hipocoradas","astenia","fadiga","adinamia","dispneia aos esforços","palpitações","taquicardia compensatória","sopro sistólico funcional","cefaleia","lipotimia","muito pálido","olho branco por dentro","cansaço por qualquer coisa","fraqueza","coração acelera ao subir escada","tontura","queda de cabelo"]},atipicos:{descricao:"Pica (alotriofagia: pagofagia/gelo ou geofagia/terra), glossite atrófica, queilite angular, coiloníquia (unhas em colher), disfagia (Plummer-Vinson), pernas inquietas",termos:["alotriofagia","pica","pagofagia","geofagia","glossite atrófica","língua despapilada","queilite angular","boqueira","coiloníquia","síndrome de Plummer-Vinson","síndrome das pernas inquietas","vontade incontrolável de comer gelo","terra ou tijolo","língua lisa e ardendo","feridinha no canto da boca","unha funda igual colher"]}},{id:"celulite-bacteriana-e-erisipela",nome:"Celulite bacteriana e Erisipela",cid:"L03.9",sistema:"Dermatologia e Oftalmo",epidemiologia:'Adultos de meia-idade e idosos,portadores de insuficiência venosa crônica, linfedema (pós-esvaziamento axilar/mastectomia ou safenectomia prévia), diabetes mellitus, obesidade, imunossuprimidos e portadores de porta de entrada cutânea (principalmente tinea pedis interdigital / "frieira", úlceras venosas, traumas ou picadas de inseto).',exameFisico:"Inspeção e palpação da lesão (delimitar as bordas do eritema com caneta demográfica para acompanhar progressão/resposta terapêutica,diferenciar bordas elevadas e bem demarcadas na Erisipela vs. bordas difusas na Celulite), inspeção obrigatória dos espaços interdigitais dos pés (procurar maceração/fissuras de micose como porta de entrada), palpação de linfonodos inguinais/axilares satélites, palpação de pulsos e pesquisa de sinais de Fasciíte Necrosante (crepitação subcutânea, anestesia cutânea sobre a placa, bolhas violáceas e dor desproporcional).",obrigatorios:{descricao:"Placa ou área de eritema agudo, edema, calor local e dor na pele/subcutâneo",termos:["eritema cutâneo agudo","edema inflamatório","calor local","dor local","celulite infecciosa","erisipela","infecção de pele e partes moles","perna vermelha","inchada e quente","pele inflamada"]},comuns:{descricao:"Erisipela: placa vermelho-viva com bordas elevadas e bem demarcadas, febre alta e calafrios, linfangite e adenomegalia inguinal dolorosa. Celulite: eritema róseo com bordas imprecisas, porta de entrada",termos:["placa eritematosa bem delimitada","sinal de Milian","bordas nítidas elevadas","bordas mal definidas","pirexia","calafrios","linfangite","linfadenopatia inguinal satélite","intertrigo micótico interdigital","mancha vermelha brilhante que está crescendo","febre e tremedeira com dor na perna","íngua na virilha","frieira entre os dedos do pé"]},atipicos:{descricao:"Dor excruciante desproporcional ao exame físico, evolução fulminante, bolhas hemorrágicas/violáceas, necrose cutânea, anestesia local, crepitação subcutânea e choque (Fasciíte Necrosante)",termos:["fasciíte necrosante","dor desproporcional ao exame físico","flictenas hemorrágicas","bolhas violáceas","necrose cutânea","hipoestesia/anestesia cutânea local","crepitação subcutânea","choque séptico","dor insuportável na perna com bolhas roxas e pele ficando preta"]}},{id:"abscesso-cutaneo-furunculo-e-antraz",nome:"Abscesso cutâneo, furúnculo e antraz",cid:"L02.9",sistema:"Dermatologia e Oftalmo",epidemiologia:"Adolescentes e adultos,áreas de atrito e sudorese (axilas, virilhas, nádegas, coxas, nuca),fatores de risco: diabetes mellitus, obesidade, higiene precária, depilação com lâmina (foliculite prévia), hidradenite supurativa, imunossuprimidos, usuários de drogas injetáveis e colonização nasal por Staphylococcus aureus (incluindo CA-MRSA).",exameFisico:'Inspeção da lesão e da extensão do halo de celulite circundante, palpação bidigital cuidadosa do centro do nódulo para pesquisar Sinal de Flutuação (que define a maturação da loja purulenta e indica drenagem cirúrgica imediata), palpação de cadeias linfonodais regionais e, se localizado na face central ("triângulo perigoso"), avaliação da motilidade ocular extrínseca.',obrigatorios:{descricao:"Nódulo ou tumoração inflamatória cutânea/subcutânea circunscrita e dolorosa, evoluindo com ponto de flutuação central ou drenagem purulenta",termos:["abscesso cutâneo","coleção purulenta subcutânea","furúnculo","antraz","carbúnculo","flutuação positiva","nódulo eritematoso doloroso","carocinho cheio de pus","tumorzinho vermelho e quente na pele","cabeça de pus"]},comuns:{descricao:"Eritema, calor e edema perilesional, dor pulsátil local que alivia drasticamente após drenagem espontânea ou cirúrgica de pus espesso, pústula folicular central",termos:["dor latejante localizada","pústula folicular central","drenagem espontânea de secreção purulenta","celulite perilesional","febre baixa","caroço latejando muito","estourou e saiu pus grosso"]},atipicos:{descricao:"Celulite facial grave e trombose séptica do seio cavernoso (furúnculos manipulados no triângulo perigoso da face – região nasolabial), hidradenite supurativa associada",termos:["furúnculo centrofacial","trombose do seio cavernoso","edema periorbitário","oftalmoplegia","pirexia","espremeu furúnculo no nariz/lábio e inchou o olho todo com dor de cabeça"]}},{id:"urticaria-aguda-e-angioedema",nome:"Urticária aguda e Angioedema",cid:"L50.9",sistema:"Dermatologia e Oftalmo",epidemiologia:"Crianças e adultos jovens, predomínio feminino em adultos,antecedente pessoal de atopia,desencadeada por medicamentos (AINEs/dipirona, antibióticos beta-lactâmicos), alimentos (crustáceos/camarão, amendoim/castanhas, leite, ovo), picadas de himenópteros (abelha, vespa, formiga), infecções virais agudas (principal causa em crianças),usuários de IECA (captopril, enalapril) no caso de angioedema isolado sem urticas.",exameFisico:"Avaliação prioritária da permeabilidade de vias aéreas e hemodinâmica (excluir Anafilaxia): inspecionar língua, úvula e orofaringe, ouvir a voz (rouquidão/estridor), ausculta pulmonar (pesquisar broncoespasmo/sibilos) e aferir PA/FC,inspeção dermatológica das pápulas edematosas e pesquisa de dermografismo (friccione a pele sã com objeto rombo para observar formação linear de urtica).",obrigatorios:{descricao:"Presença de urticas (pápulas/placas eritemato-edematosas pruriginosas e fugazes < 24h) e/ou angioedema (edema súbito de derme profunda/submucosa)",termos:["urticária aguda","urticas","pápulas edematosas fugazes","placas urticariformes","angioedema","edema de Quincke","empolação no corpo","vergões vermelhos que coçam muito","placas de alergia na pele","boca e olhos inchados de repente"]},comuns:{descricao:"Prurido intenso, dermografismo positivo, lesões que somem de um lugar e aparecem em outro sem deixar mancha, edema assimétrico de lábios, pálpebras, língua ou mãos",termos:["prurido cutâneo intenso","dermografismo","caráter migratório e fugaz das lesões","edema labial","edema palpebral","edema lingual","coceira desesperadora","placas somem em algumas horas e nascem em outro lugar","beiço inchado","olho fechado de tão inchado"]},atipicos:{descricao:"Edema de glote (rouquidão, estridor, disfagia), broncoespasmo (sibilância e dispneia), cólica abdominal/vômitos, hipotensão/choque anafilático,angioedema isolado por IECA",termos:["anafilaxia","choque anafilático","edema de glote","estridor laríngeo","disfonia aguda","dispneia","broncoespasmo","sibilância","hipotensão arterial","angioedema bradicinérgico por IECA","garganta fechando","falta de ar e voz rouca após alergia","língua inchou tanto que não cabe na boca"]}},{id:"dermatite-de-contato-e-dermatite-atopica",nome:"Dermatite de contato e Dermatite atópica",cid:"L23.9",sistema:"Dermatologia e Oftalmo",epidemiologia:"Dermatite Atópica: início na infância (85% antes dos 5 anos), história pessoal ou familiar de asma e rinite alérgica. Dermatite de Contato: adultos com exposição ocupacional ou cosmética (pedreiros [cimento/bicromato], profissionais de limpeza/donas de casa [detergentes], profissionais de saúde [látex], uso de bijuterias [sulfato de níquel], tinturas de cabelo [parafenilenodiamina] ou plantas).",exameFisico:"Inspeção dermatológica completa avaliando a morfologia do eczema (agudo: eritema, edema, vesículas e exsudação,crônico: xerose, descamação, fissuras e liquenificação / espessamento do quadriculado da pele) e o padrão de distribuição topográfica (dobras flexurais cubitais e poplíteas na atópica vs. desenho geométrico exato da área de contato com relógio, botão da calça, brinco ou calçado na de contato), além de pesquisar crostas melicéricas (impetiginização).",obrigatorios:{descricao:"Lesão eczematosa (eritema, vesículas/exsudação na fase aguda ou descamação/liquenificação na fase crônica) obrigatoriamente associada a prurido",termos:["eczema agudo","eczema crônico","dermatite de contato","dermatite atópica","eritema descamativo","vesiculação cutânea","liquenificação","prurido cutâneo","alergia na pele","pele vermelha","descascando e coçando","pele grossa de tanto coçar"]},comuns:{descricao:"Contato: lesões restritas à área de exposição (níquel, cosméticos, produtos de limpeza). Atópica: xerose cutânea difusa, acometimento de dobras flexurais (fossas cubitais e poplíteas), escoriações",termos:["xerose cutânea","pele seca","eczema flexural","acometimento de fossas cubitais e poplíteas","escoriações por coçadura","crostas serosas","fissuras palmares","alergia onde encosta o brinco","botão da calça ou relógio","alergia de detergente nas mãos","coceira nas dobras dos braços e atrás dos joelhos"]},atipicos:{descricao:"Impetiginização secundária (crostas melicéricas amareladas), Eczema Herpético (erupção de Kaposi), eritrodermia esfoliativa",termos:["eczema impetiginizado","infecção bacteriana secundária","crostas melicéricas","erupção variceliforme de Kaposi","eczema herpético","eritrodermia","feridas da alergia começaram a soltar água amarela e pus"]}},{id:"herpes-zoster-cobreiro",nome:"Herpes Zoster (Cobreiro)",cid:"B02.9",sistema:"Dermatologia e Oftalmo",epidemiologia:"Idosos (> 50-60 anos) pela imunossenescência celular e imunossuprimidos de qualquer idade (portadores de HIV/AIDS, pacientes oncológicos em quimioterapia, transplantados, usuários de corticoides ou imunobiológicos),antecedente obrigatório de infecção primária pelo vírus Varicela-Zoster (catapora na infância).",exameFisico:'Inspeção dermatológica (confirmar vesículas agrupadas em "buquê" sobre base eritematosa que respeitam estritamente a linha média ao longo de um único dermátomo), teste de sensibilidade/alodínia no dermátomo,se acometimento facial (ramo V1 do trigêmeo), pesquisar obrigatoriamente o Sinal de Hutchinson (vesículas na ponta ou asa do nariz) e realizar exame ocular com fluoresceína,se acometimento auricular, realizar otoscopia e testar mímica facial.',obrigatorios:{descricao:'Vesículas agrupadas sobre base eritematosa ("em buquê"), estritamente unilaterais, respeitando um único dermátomo sem cruzar a linha média',termos:["vesículas agrupadas em buquê","distribuição dermatomérica unilateral","erupção zosteriforme","herpes zoster","cobreiro","bolhinhas de água em faixa de um lado só do corpo","feridas que não passam do meio da barriga/peito"]},comuns:{descricao:"Dor neuropática intensa no dermátomo (queimação, pontada, choque ou alodínia, precedendo ou acompanhando as lesões), evolução para pústulas e crostas, dermátomo torácico, lombar ou trigeminal",termos:["dor neuropática herpética","alodínia mecânica","hiperestesia cutânea","neuralgia pré-herpética","neuralgia pós-herpética","parestesia local","crostas hemáticas","pele queimando como fogo","dor de agulhada ou choque nas costelas","dói só de a camisa encostar na pele"]},atipicos:{descricao:"Dor prodrômica sem lesões ainda visíveis (simulando infarto, cólica renal ou colecistite), Herpes Zoster Oftálmico com Sinal de Hutchinson (vesículas na ponta do nariz)",termos:["zoster sine herpete","herpes zoster oftálmico","sinal de Hutchinson positivo","acometimento do ramo oftálmico do trigêmeo V1","ceratite herpética","zoster disseminado","bolhinhas na testa","olho e ponta do nariz com olho vermelho"]}},{id:"dermatomicoses-superficiais-tinea",nome:"Dermatomicoses superficiais (Tinea)",cid:"B35.9",sistema:"Dermatologia e Oftalmo",epidemiologia:"Todas as idades (Tinea capitis quase exclusiva de crianças escolares,Tinea pedis e cruris predominam em adolescentes e adultos do sexo masculino),clima tropical quente e úmido, hiperidrose, atletas, militares/uso prolongado de calçados fechados, obesos (dobras inguinais), diabéticos, frequentadores de vestiários/piscinas coletivas e contato com animais domésticos (cães e gatos com lesões alopécicas).",exameFisico:"Inspeção dermatológica sob boa iluminação (identificar placas anulares com borda eritematosa, papulovesiculosa e descamativa elevada e centro mais claro na Tinea corporis/cruris, ou maceração esbranquiçada e fissuras entre o 4º e 5º espaços interdigitais dos pés na Tinea pedis), inspeção das lâminas ungueais (onicomicose associada como reservatório) e palpação do couro cabeludo/linfonodos cervicais em crianças com Tinea capitis.",obrigatorios:{descricao:"Lesão cutânea eritemato-descamativa (placa anular ou maceração interdigital) causada por dermatófitos",termos:["dermatofitose","tinea corporis","tinea cruris","tinea pedis","placa eritemato-descamativa anular","maceração interdigital","micose de pele","impingem","frieira","pé de atleta"]},comuns:{descricao:"Placas circinadas com borda ativa (eritematosa, papulovesiculosa e descamativa) de crescimento centrífugo e centro mais claro, prurido (pior com calor/suor), fissuras entre os dedos dos pés",termos:["lesão anular circinada","borda eritemato-vesiculosa ativa","cura central","prurido","fissuras interdigitais","descamação plantar em mocassim","mancha redonda vermelha com borda áspera que vai crescendo","coceira na virilha","pele branca e rachada entre os dedos do pé"]},atipicos:{descricao:"Tinea incognito (lesão descaracterizada pelo uso de corticoide tópico), Kerion Celsi (placa inflamatória purulenta no couro cabeludo de crianças)",termos:["tinea incognito","kerion celsi","tinea capitis inflamatória","alopecia micótica","passou pomada de corticoide e a mancha espalhou e perdeu o formato","ferida inchada com pus e queda de cabelo na cabeça da criança"]}},{id:"escabiose",nome:"Escabiose",cid:"B86",sistema:"Dermatologia e Oftalmo",epidemiologia:"Todas as faixas etárias, alta prevalência em crianças, jovens sexualmente ativos e idosos,ambientes de aglomeração familiar ou institucional (asilos/ILPIs, creches, quartéis, presídios, abrigos), vulnerabilidade socioeconômica, compartilhamento de camas/roupas,imunossuprimidos e portadores de síndrome de Down (risco de Sarna Crostosa/Norueguesa).",exameFisico:"Inspeção dermatológica minuciosa com lupa/dermatoscópio nas zonas eletivas de Hebra (espaços interdigitais das mãos, face flexora dos punhos, cotovelos, pregas axilares anteriores, região periumbilical, cintura, glúteos, aréolas mamárias em mulheres e nódulos escabióticos na glande/bolsa escrotal em homens) em busca do túnel escabiótico,em lactentes, examinar palmas, plantas e couro cabeludo.",obrigatorios:{descricao:"Prurido cutâneo intenso com piora característica noturna, associado a pápulas/vesículas em topografias típicas e/ou contactantes domiciliares com o mesmo quadro",termos:["prurido noturno intenso","escabiose","epidemiologia familiar positiva","pápulas escoriadas simétricas","sarna","coceira que piora muito à noite ao esquentar na cama","mais gente em casa se coçando igual"]},comuns:{descricao:"Túnel/galeria escabiótica, lesões nos espaços interdigitais das mãos, punhos (face flexora), axilas, região periumbilical, nádegas, aréolas mamárias e nódulos na glande/escroto (poupando cabeça em adultos)",termos:["túnel escabiótico","galeria acarina","eminência acariana","pápulas interdigitais","nódulos escabióticos penianos/escrotais","acometimento periumbilical e axilar","bolinhas que coçam entre os dedos das mãos","nos pulsos","barriga e bico do peito","caroços que coçam muito no pênis e saco escrotal"]},atipicos:{descricao:"Lesões em palmas, plantas e couro cabeludo (lactentes), Escabiose Crostosa/Norueguesa (crostas hiperqueratóticas espessas com pouco prurido em imunossuprimidos/idosos)",termos:["escabiose crostosa","sarna norueguesa","hiperqueratose disseminada","acometimento palmoplantar infantil","impetiginização secundária","bolinhas nas mãos e pés do bebê","cascas grossas pelo corpo todo em idoso acamado"]}},{id:"conjuntivite-aguda",nome:"Conjuntivite aguda",cid:"H10.9",sistema:"Dermatologia e Oftalmo",epidemiologia:"Todas as idades (conjuntivite bacteriana é mais comum em crianças,viral por Adenovírus predomina em adultos e surtos comunitários/escolares,alérgica em atópicos),contato direto com secreções oculares, mãos contaminadas, IVAS recente ou usuários de lentes de contato (alerta máximo para ceratite bacteriana por Pseudomonas ou Acanthamoeba).",exameFisico:"Teste de acuidade visual (Tabela de Snellen – deve estar preservada), avaliação dos reflexos pupilares fotomotor direto e consensual (pupilas isocóricas e fotorreagentes excluem uveíte e glaucoma agudo), inspeção do padrão de hiperemia (conjuntival periférica vs. injeção ciliar pericerática), eversão das pálpebras, teste com colírio de fluoresceína e luz azul de cobalto (excluir úlcera de córnea/ceratite herpética dendrítica) e palpação de linfonodo pré-auricular.",obrigatorios:{descricao:"Hiperemia conjuntival difusa (tarsal e bulbar periférica) associada a secreção ocular, com acuidade visual e reflexos pupilares normais",termos:["hiperemia conjuntival","injeção conjuntival difusa","secreção ocular","conjuntivite aguda","olho vermelho","olho inflamado","olho remelando"]},comuns:{descricao:'Sensação de corpo estranho ("areia nos olhos"), lacrimejamento, edema palpebral leve, pálpebras coladas ao acordar, secreção mucopurulenta (bacteriana), aquosa com linfonodo pré-auricular (viral) ou prurido intenso bilateral (alérgica)',termos:["sensação de corpo estranho ocular","epífora","lacrimejamento","secreção mucopurulenta","secreção serosa/aquosa","prurido ocular","quemose conjuntival","edema palpebral","linfadenopatia pré-auricular","sensação de areia ou cisco no olho","acorda com o olho grudado de remela amarela","coceira nos dois olhos"]},atipicos:{descricao:"Dor ocular intensa, fotofobia severa, baixa da acuidade visual, injeção ciliar/pericerática, opacidade corneana ou pupila fixa (Red Flags Oftalmológicos)",termos:["dor ocular intensa","fotofobia severa","redução da acuidade visual","turvação visual","injeção ciliar","injeção pericerática","hipópio","ceratite","uveíte anterior","olho vermelho com visão embaçada e dor forte na luz"]}},{id:"hordeolo-tercol-e-calazio",nome:"Hordéolo (Terçol) e Calázio",cid:"H00.0",sistema:"Dermatologia e Oftalmo",epidemiologia:"Crianças, adolescentes e adultos jovens,portadores de blefarite crônica, disfunção das glândulas de Meibomius, dermatite seborreica, acne rosácea, diabetes mellitus, dislipidemia ou uso de maquiagem ocular sem remoção adequada.",exameFisico:"Inspeção externa da margem palpebral e cílios (procurar crostas descamativas de blefarite associada e ponto de drenagem folicular no hordéolo externo), palpação digital delicada da pálpebra (dor aguda intensa no hordéolo vs. nódulo firme e indolor no calázio), eversão da pálpebra (visualizar hordéolo interno ou granuloma tarsal) e avaliação da motilidade ocular extrínseca (sempre normal,se houver dor à movimentação ocular ou proptose, suspeitar de celulite pós-septal/orbitária).",obrigatorios:{descricao:"Nódulo localizado na margem ou espessura da pálpebra superior ou inferior",termos:["nódulo palpebral","hordéolo externo","hordéolo interno","calázio","terçol","viúva","bolinha na pálpebra","carocinho no olho"]},comuns:{descricao:"Hordéolo: nódulo agudo, eritematoso, quente e doloroso na borda ciliar com ponto purulento (terçol). Calázio: nódulo crônico/subagudo, firme, bem delimitado e indolor na espessura tarsal",termos:["edema palpebral localizado","eritema palpebral","pústula na base do cílio","dor à palpação palpebral","nódulo tarsal indolor","granuloma lipogranulomatoso de Meibomius","terçol vermelho","inchado e doendo na beirada dos cílios","bolinha dura na pálpebra que não dói"]},atipicos:{descricao:"Evolução para celulite pré-septal (edema e eritema de toda a pálpebra), astigmatismo mecânico por compressão corneana",termos:["celulite pré-septal secundária","edema periorbitário difuso","terçol espalhou e inchou a pálpebra inteira"]}},{id:"dengue",nome:"Dengue",cid:"A90",sistema:"Infectologia e Parasito",epidemiologia:"Todas as faixas etárias em áreas urbanas/periurbanas endêmicas ou epidêmicas no Brasil (sazonalidade de verão/meses chuvosos, proliferação do Aedes aegypti),maior risco de evolução para Dengue Grave (extravasamento plasmático/choque) em infecção secundária por sorotipo diferente, lactentes (< 2 anos), gestantes, idosos (> 65 anos) e portadores de HAS, DM, asma, doença renal crônica ou doença falciforme.",exameFisico:"Aferição de PA em duas posições (deitado e em pé, para detectar hipotensão postural precoce e convergência pressórica: PA diferencial <= 20 mmHg), avaliação do pulso e Tempo de Enchimento Capilar, realização obrigatória da Prova do Laço (se não houver sangramento espontâneo), inspeção de pele e mucosas (exantema, petéquias, gengivorragia), ausculta cardiopulmonar (pesquisar derrame pleural) e palpação abdominal (dor intensa e hepatomegalia dolorosa > 2 cm do rebordo costal).",obrigatorios:{descricao:"Febre aguda (2 a 7 dias) associada a pelo menos dois de: cefaleia/dor retro-orbitária, mialgia, artralgia, prostração, exantema, náuseas/vômitos ou prova do laço positiva/petéquias",termos:["síndrome febril aguda","pirexia","cefaleia","dor retro-orbitária","mialgia intensa","artralgia","astenia","prostração","exantema maculopapular","prova do laço positiva","petéquias","dengue","febre alta","dor no fundo dos olhos","dor no corpo todo","febre quebra-ossos"]},comuns:{descricao:"Prurido cutâneo (especialmente palmoplantar na fase de exantema/recuperação), anorexia, náuseas, gosto metálico/amargo na boca, diarreia leve, leucopenia e plaquetopenia",termos:["prurido cutâneo","prurido palmoplantar","hiporexia","anorexia","náuseas","disgeusia","manchas vermelhas pelo corpo que coçam muito","coceira na palma da mão e sola do pé","enjoo","sem apetite nenhum","plaquetas baixas"]},atipicos:{descricao:"Dor abdominal intensa e contínua, vômitos persistentes, hipotensão postural/lipotimia, hepatomegalia dolorosa, sangramento de mucosas, letargia/irritabilidade, derrames cavitários e choque (Sinais de Alarme/Grave)",termos:["sinais de alarme da dengue","dor abdominal intensa e contínua","vômitos persistentes","hipotensão postural","lipotimia","síncope","gengivorragia","epistaxe","metrorragia","hematêmese","melena","hepatomegalia dolorosa","ascite","derrame pleural","hemoconcentração","choque da dengue","febre baixou e começou dor forte na barriga e vômitos que não param","sangramento na gengiva e nariz","tontura e desmaio ao levantar"]}},{id:"febre-de-chikungunya-zika-virus",nome:"Febre de Chikungunya / Zika vírus",cid:"A92.0",sistema:"Infectologia e Parasito",epidemiologia:"Áreas endêmicas/epidêmicas com circulação do Aedes aegypti,Chikungunya: maior gravidade aguda em neonatos, idosos e cardiopatas, e maior taxa de cronificação articular (> 3 meses) em mulheres > 45 anos e portadores de osteoartrite prévia. Zika: altíssimo risco teratogênico em gestantes (Síndrome Congênita do Zika / microcefalia).",exameFisico:"Sinais vitais, inspeção cutânea e conjuntival, palpação de cadeias linfonodais (retroauriculares e cervicais no Zika), exame articular periférico detalhado (inspeção e palpação de interfalangianas, metacarpofalângicas, punhos, tornozelos e bainhas tendíneas para documentar sinovite/edema periarticular simétrico e tenossinovite) e avaliação neurológica (força e reflexos profundos se queixa de fraqueza pós-viral).",obrigatorios:{descricao:"Chikungunya: Febre de início súbito (> 38,5°C) + poliartralgia/poliartrite intensa e incapacitante. Zika: Exantema maculopapular pruriginoso precoce + hiperemia conjuntival não purulenta e artralgia/edema periarticular",termos:["poliartralgia intensa","poliartrite simétrica aguda","pirexia súbita","exantema maculopapular pruriginoso","hiperemia conjuntival não purulenta","edema periarticular","chikungunya","zika","febre alta com dor insuportável em todas as juntas","manchas vermelhas que coçam muito com olho vermelho sem remela"]},comuns:{descricao:"Acometimento simétrico distal (mãos, punhos, tornozelos e pés), rigidez matinal acentuada, tenossinovite, mialgia, cefaleia, linfadenopatia retroauricular (Zika)",termos:["artrite de pequenas articulações","tenossinovite aguda","rigidez articular matinal","mialgia","cefaleia","adenomegalia retroauricular","febrícula ou afebril","mãos","pulsos e tornozelos inchados e travados","não consegue fechar a mão nem pisar no chão de tanta dor nas juntas"]},atipicos:{descricao:"Síndrome de Guillain-Barré (paralisia flácida ascendente pós-Zika), meningoencefalite, lesões vesiculobolhosas e dor articular crônica incapacitante",termos:["síndrome de Guillain-Barré","paralisia flácida arreflexa ascendente","artrite crônica pós-chikungunya","fraqueza subindo pelas pernas após virose"]}},{id:"sifilis",nome:"Sífilis",cid:"A53.9",sistema:"Infectologia e Parasito",epidemiologia:"Adolescentes e adultos sexualmente ativos,práticas sexuais sem preservativo, múltiplos parceiros, populações-chave (HSH, profissionais do sexo), coinfectados pelo HIV e gestantes (rastreio obrigatório no pré-natal pelo risco de Sífilis Congênita).",exameFisico:"Inspeção da genitália externa, região perianal e cavidade oral (palpação com luva da úlcera do cancro duro: única, fundo limpo, indolor e com base endurecida/cartilaginosa,ou placas úmidas de condiloma plano), inspeção obrigatória das palmas das mãos e plantas dos pés (procurar máculas/pápulas eritemato-acastanhadas com colarete descamativo de Biet da sífilis secundária), inspeção do couro cabeludo/sobrancelhas (alopecia em clareira e madarose) e palpação de linfonodos inguinais, cervicais e epitrocleares.",obrigatorios:{descricao:"Úlcera genital/extragenital indolor (Primária / Cancro duro) OU lesões cutaneomucosas disseminadas / roséola e sifílides palmoplantares (Secundária) OU sorologia reagente assintomática (Latente)",termos:["cancro duro","úlcera genital única indolor","roséola sifilítica","sifílides papulosas palmoplantares","condiloma plano","sífilis primária","sífilis secundária","sífilis latente","ferida no pênis/vagina que não dói","manchas vermelhas/escuras na palma da mão e sola do pé","exame VDRL positivo"]},comuns:{descricao:"Úlcera de fundo limpo e bordas endurecidas que some sozinha, adenomegalia inguinal bilateral indolor (primária),colarete descamativo de Biet nas lesões palmoplantares, alopecia em clareira, madarose, placas mucosas orais, poliadenopatia e febrícula (secundária)",termos:["linfadenopatia inguinal indolor","colarete de Biet","alopecia em clareira","madarose","placas mucosas orais","poliadenopatia generalizada","linfonodo epitroclear palpável","febrícula","mal-estar","ferida dura na genitália que sumiu sem tratamento","íngua na virilha que não dói","bolinhas descascando na mão e no pé","falhas no cabelo e na sobrancelha"]},atipicos:{descricao:"Uveíte sifilítica (perda visual/olho vermelho), meningite sifilítica aguda, paralisia de pares cranianos (neurossífilis precoce), hepatite sifilítica",termos:["neurossífilis","uveíte sifilítica","baixa acuidade visual aguda","meningite asséptica sifilítica","visão turva e moscas volantes com manchas nas mãos"]}},{id:"parasitoses-intestinais",nome:"Parasitoses intestinais",cid:"B82.9",sistema:"Infectologia e Parasito",epidemiologia:"Crianças pré-escolares e escolares, moradores de áreas rurais ou periferias sem saneamento básico/água tratada, hábito de andar descalço no solo (ancilostomíase e estrongiloidíase), frequentadores de creches (giardíase e enterobíase/oxiuríase) e pacientes candidatos a imunossupressão/pulsoterapia com corticoides (risco de estrongiloidíase disseminada).",exameFisico:"Avaliação antropométrica/curva de crescimento em crianças, inspeção de mucosas (palidez por anemia espoliativa da ancilostomíase), ausculta e palpação abdominal (distensão, meteorismo, dor periumbilical ou massa cilíndrica palpável na suboclusão por Ascaris), inspeção da região perianal (escoriações por coçadura na oxiuríase) e ausculta pulmonar (sibilos se fase larvária / Síndrome de Loeffler).",obrigatorios:{descricao:"Sintomas gastrointestinais inespecíficos (dor abdominal, diarreia/alteração fecal ou prurido anal) ou eliminação visível de parasitas",termos:["parasitose intestinal","helmintíase","protozoose","eliminação de vermes nas fezes","dor abdominal recorrente","diarreia crônica/intermitente","verme na barriga","lombriga","solitária","giárdia","saiu bicho no cocô"]},comuns:{descricao:"Cólicas periumbilicais, epigastralgia (estrongiloidíase/giardíase), fezes esteatorreicas/fétidas que boiam (giardíase), distensão abdominal, flatulência, prurido anal noturno intenso (oxiuríase), hiporexia, anemia/eosinofilia",termos:["cólica periumbilical","epigastralgia","esteatorreia","diarreia disabsortiva","meteorismo","distensão abdominal","prurido anal noturno","enterobíase","ascaridíase","giardíase","eosinofilia","dor de barriga ao redor do umbigo","coceira forte no ânus à noite","barriga inchada de verme","diarreia amarela com gordura e cheiro muito forte"]},atipicos:{descricao:"Síndrome de Loeffler (tosse seca, sibilos e infiltrado pulmonar migratório), suboclusão/obstrução intestinal por bolo de Ascaris, prolapso retal (tricocefalíase)",termos:["síndrome de Loeffler","pneumonite eosinofílica","tosse seca e sibilância","obstrução intestinal por bolo de Ascaris","vômito com eliminação de Ascaris","prolapso retal","hiperinfecção por Strongyloides","vomitou uma lombriga","barriga trancou por bolo de verme"]}},{id:"entorse-e-distensao-articular",nome:"Entorse e distensão articular",cid:"S93.4",sistema:"Traumatologia",epidemiologia:"Adolescentes e adultos jovens fisicamente ativos,praticantes de esportes com salto, mudança rápida de direção ou contato (futebol, futsal, basquete, vôlei, corrida em terreno irregular), uso de calçados instáveis/salto alto e histórico de entorse prévia (instabilidade ligamentar crônica).",exameFisico:"Inspeção de edema e equimose, avaliação da capacidade de apoiar o peso e dar 4 passos, aplicação das Regras de Tornozelo de Ottawa (palpação óssea da borda posterior dos 6 cm distais dos maléolos lateral e medial, base do 5º metatarso e osso navicular para decidir necessidade de radiografia), palpação da fíbula proximal (excluir fratura de Maisonneuve) e testes de estabilidade ligamentar (Gaveta Anterior do tornozelo para ligamento talofibular anterior,Lachman, Gaveta Anterior/Posterior e estresse em valgo/varo no joelho).",obrigatorios:{descricao:"Trauma articular torcional/indireto (inversão, eversão ou rotação forçada) cursando com dor aguda e lesão ligamentar, mantendo a congruência articular",termos:["entorse articular","trauma torcional em inversão","trauma em eversão","estiramento ligamentar","lesão do ligamento talofibular anterior","torceu o pé","torceu o tornozelo","virada de pé","torção no joelho","mau jeito na junta"]},comuns:{descricao:"Dor imediata na topografia ligamentar (maléolo lateral/medial), edema periarticular rápido, equimose (graus II e III), limitação para apoiar o membro/deambular, instabilidade aos testes (gaveta anterior/Lachman)",termos:["edema periarticular","edema maleolar","equimose perimaleolar","hematoma articular","hemartrose","claudicação antálgica","teste da gaveta anterior positivo","teste de Lachman positivo","tornozelo inchou na hora igual uma bola","ficou roxo no lado do pé","mancando","dor ao pisar"]},atipicos:{descricao:"Incapacidade de dar 4 passos + dor óssea na borda posterior dos maléolos, base do 5º metatarso ou navicular (Critérios de Ottawa positivos para fratura),dor na fíbula proximal (Maisonneuve)",termos:["critérios de Ottawa positivos","incapacidade de deambular 4 passos","dor óssea maleolar posterior","dor na base do quinto metatarso","dor no osso navicular","não consegue colocar o pé no chão nem dar um passo depois que torceu"]}},{id:"ferimento-corto-contuso-laceracao",nome:"Ferimento corto-contuso / Laceração",cid:"T14.1",sistema:"Traumatologia",epidemiologia:"Crianças (quedas da própria altura batendo mento, fronte ou supercílio), adultos jovens do sexo masculino (acidentes de trabalho com ferramentas/facas/vidro, acidentes de trânsito, agressões físicas), etilistas agudos e idosos (fragilidade cutânea / skin tears).",exameFisico:"Avaliação neurovascular e tendínea distal ANTES da infiltração anestésica (testar sensibilidade tátil/dolorosa distal ao ferimento, preenchimento capilar, pulso e testar isoladamente os tendões flexores superficial e profundo dos dedos e extensores contra resistência), seguida de anestesia local, hemostasia, lavagem exaustiva com SF 0,9% e exploração visual e digital do fundo da ferida (identificar corpos estranhos retidos, violação de cápsula articular ou aponeurose).",obrigatorios:{descricao:"Solução de continuidade traumática da pele (epiderme/derme) e/ou tela subcutânea por agente cortante ou trauma rombo",termos:["ferimento corto-contuso","FCC","ferimento inciso","laceração cutânea","solução de continuidade da pele","ferida aberta","corte na pele","talho","machucado aberto precisando de ponto","abriu a cabeça/supercílio"]},comuns:{descricao:"Sangramento ativo (capilar, venoso ou arterial), bordas regulares (inciso) ou irregulares/contusas com pontes teciduais (corto-contuso), dor local, exposição de tecido adiposo subcutâneo",termos:["sangramento ativo","hemorragia local","bordas regulares","bordas irregulares contusas","exposição de tecido celular subcutâneo","dor local","sangrando muito","corte fundo aparecendo a gordura/carne","corte com faca/vidro"]},atipicos:{descricao:"Secção tendínea (perda do movimento ativo de flexão/extensão do dedo), lesão nervosa periférica (anestesia distal ao corte), sangramento arterial pulsátil em jato, corpo estranho retido",termos:["lesão tendínea","tenorrafia necessária","perda da atitude fisiológica dos dedos","lesão de nervo digital","hipoestesia/anestesia distal ao ferimento","hemorragia arterial pulsátil","corpo estranho radiopaco","cortou a mão e não consegue dobrar ou esticar o dedo","ponta do dedo ficou dormente depois do corte","sangue esguichando no ritmo do coração","ficou caco de vidro dentro do corte"]}},{id:"tce-leve-concussao",nome:"TCE leve / Concussão",cid:"S06.0",sistema:"Traumatologia",epidemiologia:"Crianças pequenas (< 5 anos, quedas de cama/trocador/escada), adultos jovens (acidentes motociclísticos/automobilísticos, esportes de contato, agressões), etilistas e idosos (> 65 anos, quedas da própria altura),altíssimo risco de sangramento intracraniano em usuários de anticoagulantes (varfarina, rivaroxabana, apixabana, dabigatrana) ou antiagregantes plaquetários e hepatopatas/coagulopatas.",exameFisico:"Avaliação primária do trauma (ABCDE com proteção cervical se indicado pelos critérios NEXUS/Canadian C-Spine), aplicação seriada da Escala de Coma de Glasgow, avaliação de simetria e fotorreação das pupilas, exame neurológico focal, palpação do couro cabeludo (hematomas/afundamentos), otoscopia (hemotímpano) e pesquisa de sinais de Fratura de Base de Crânio (Sinal do Guaxinim [equimose periorbitária], Sinal de Battle [equimose mastoidea retroauricular], otoliquorreia e rinoliquorreia).",obrigatorios:{descricao:"História de impacto craniano direto ou desaceleração com Escala de Coma de Glasgow entre 13 e 15 na avaliação inicial",termos:["traumatismo cranioencefálico leve","TCE leve","concussão cerebral","trauma craniano contuso","Glasgow 13 a 15","bateu a cabeça","pancada na cabeça","queda batendo a cabeça"]},comuns:{descricao:'Cefaleia aguda pós-traumática, tontu
